// Конфигурация на стабилността за Compose компилатора (app/build.gradle.kts → composeCompiler).
// Типовете тук се смятат за стабилни, въпреки че са компилирани без Compose компилатора
// (модулът :shared е чист Kotlin/JVM) или са от стандартната библиотека/JDK.
// С „strong skipping“ (по подразбиране от Kotlin 2.0.20) нестабилните параметри се сравняват
// по референция (===); стабилните — с equals(), така че композицията се прескача и когато
// ViewModel-ът върне нов, но равен обект (напр. същия списък книги след опресняване).
//
// Синтаксис: `*` — един сегмент от името, `**` — произволен брой сегменти (вкл. вложени
// класове), `<_>` — стабилността зависи от типовия параметър, `<*>` — не зависи.

// Домейн моделите от :shared — проверено: data класове / enum / sealed интерфейси само с `val`,
// без масиви и без изменяеми колекции (List/Map са read-only интерфейси, пълнени еднократно
// при разчитане). Ново поле `var`, MutableList или Array там нарушава това обещание.
org.chyavorec.domain.model.**
// Поводите за украсата (DayDecor, Occasion, SiteOccasion …) — също data класове/enum само с `val`.
org.chyavorec.domain.occasion.**

// Резултати и грешки от слоя с данни (org.chyavorec.core): също само `val`.
org.chyavorec.core.AppError
org.chyavorec.core.Outcome<_>
org.chyavorec.core.Synced<_>

// java.time (Instant, LocalDate, …) — неизменяеми по договор на JDK.
java.time.*

// Колекциите на Kotlin (List, Set, Map, …) — компромис: компилаторът по подразбиране ги
// смята за нестабилни, защото List може да е MutableList отдолу. Тук ги приемаме за стабилни
// (известна практика), защото в приложението списъците към UI се създават наново при
// всяка промяна (map/filter/copy) и никога не се променят на място след подаване към
// composable. Цената: ако някой код промени MutableList, подаден на composable, без да
// създаде нов обект, екранът няма да се прекомпозира. Шаблонът обхваща и Mutable* типовете
// от kotlin.collections — те не бива да се подават към composable функции.
kotlin.collections.*
