name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # write — само за клона „screenshots“ (снимки на екраните при push)
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared core tests (JVM)
        working-directory: shared
        run: ../gradlew --no-daemon test

      - name: Unit, ViewModel, repository and UI (Robolectric) tests
        run: ./gradlew --no-daemon testDevDebugUnitTest testProdDebugUnitTest

      # Снимките на екраните (ScreenshotTest) → клон „screenshots“, за да се виждат
      # директно в GitHub: https://github.com/<repo>/tree/screenshots
      - name: Publish screenshots
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d app/build/reports/screenshots ] || exit 0
          D=$(mktemp -d)
          cp app/build/reports/screenshots/*.png "$D"/
          {
            echo "# Снимки на екраните"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` (\`${GITHUB_REF_NAME}\`), генерирани от \`ScreenshotTest\` (Robolectric, примерни данни)."
            echo
            for f in "$D"/*.png; do n=$(basename "$f"); echo "### $n"; echo; echo "<img src=\"$n\" width=\"360\">"; echo; done
          } > "$D/README.md"
          cd "$D"
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - name: Lint
        run: ./gradlew --no-daemon lintDevDebug lintProdRelease

      - name: Debug APKs
        run: ./gradlew --no-daemon assembleDevDebug assembleProdDebug

      # Подписване: истинският upload ключ идва от GitHub Secrets. Ако липсва,
      # се генерира временен ключ само за да се провери, че подписаният build
      # работи — такъв AAB НЕ се качва в Google Play.
      - name: Prepare signing key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=upload" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias ci-test -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI test key, O=not for release"
            echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=ci-test" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=ci-test-only" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # AAB за Google Play = prodPlay (без самообновяване); APK за директно
      # инсталиране = prodRelease (със самообновяване от GitHub Releases).
      - name: Release AAB (Play) + APK (prod)
        run: ./gradlew --no-daemon bundleProdPlay assembleProdRelease

      - name: Verify release signature and Play manifest
        run: |
          jarsigner -verify app/build/outputs/bundle/prodPlay/app-prod-play.aab | tail -1
          echo "Signed with: $SIGNING_KIND"
          M=app/build/intermediates/merged_manifest/prodPlay/processProdPlayMainManifest/AndroidManifest.xml
          [ -f "$M" ] || M=$(find app/build/intermediates -path '*prodPlay*' -name AndroidManifest.xml | head -1)
          if grep -q "REQUEST_INSTALL_PACKAGES\|UpdateInstallReceiver" "$M"; then
            echo "::error::Play build must not contain self-update"; exit 1
          fi
          echo "Play manifest OK ($M)"

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.SIGNING_KIND }}
          path: |
            app/build/outputs/bundle/prodPlay/*.aab
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/mapping/prodRelease/mapping.txt
            app/build/outputs/mapping/prodPlay/mapping.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            shared/build/reports/
