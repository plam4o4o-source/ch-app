name: Android CI

# Кога: push в main и в клоните за разработка (claude/**, wave*/**), всеки pull request и
# ръчно. Клоните debug/** (временни проверки на емулатор със собствени workflow-и) не пускат
# пълния CI. PR от клон, който вече се проверява при push (същият commit), не се проверява
# втори път — остават PR-ите от fork-ове и от Dependabot (dependabot-automerge.yml чака тях).
on:
  push:
    branches: [main, "claude/**", "wave*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Нов push в същия клон / PR отменя още незавършената проверка на предишния.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Първо проверките (тестове, lint, debug) — само с права за четене; след тях, ако са минали:
# подписаният release build (R8 за prodPlay и prodRelease) и публикуването на снимките на
# екраните (единствената задача с право за запис). Gradle daemon-ът остава жив между стъпките.
jobs:
  checks:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.head_ref == 'main' || startsWith(github.head_ref, 'claude/') ||
        (startsWith(github.head_ref, 'wave') && contains(github.head_ref, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Само четене, и токенът не остава в .git/config: тестовете, lint и плъгините (вкл. слети
    # от Dependabot) не могат да пишат в хранилището. Снимките публикува publish-screenshots.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared core tests (JVM)
        working-directory: shared
        run: ../gradlew test

      # Тестовете не зависят от flavor-а — веднъж за prod (снимките на екраните са от него).
      # Демо входът съществува само в dev, затова MainFlowsUiTest върви и за dev
      # (опцията --tests важи само за задачата точно преди нея).
      - name: Unit, ViewModel, repository and UI (Robolectric) tests
        run: ./gradlew testProdDebugUnitTest testDevDebugUnitTest --tests 'org.chyavorec.app.ui.MainFlowsUiTest'

      # Схемите на Room (app/schemas) се пазят в Git: компилацията по-горе изнася схемата на
      # текущия код; ако тя се различава от записаната (или липсва), проверката спира с diff-а —
      # новата схема се добавя в commit-а заедно с миграцията (виж AppDatabaseMigrationTest).
      - name: Room schemas are committed
        run: |
          git add --intent-to-add app/schemas
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::Room schema in app/schemas differs from the code - commit the exported schema (and a migration)"
            exit 1
          fi

      # Снимките на екраните (ScreenshotTest) — artifact; в клона „screenshots“ ги качва
      # publish-screenshots, след като всички проверки са минали.
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/reports/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        run: ./gradlew lintDevDebug lintProdRelease

      - name: Debug APKs
        run: ./gradlew assembleDevDebug assembleProdDebug

      # Генераторът на Baseline профила се компилира при всяка промяна; самото
      # генериране (на емулатор) е в baseline-profile.yml.
      - name: Baseline profile generator (compile)
        run: ./gradlew :baselineprofile:assembleProdNonMinifiedRelease

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            shared/build/reports/

  # Снимките на екраните → клон „screenshots“, за да се виждат директно в GitHub:
  # https://github.com/<repo>/tree/screenshots. Само при push в main и в клоните за разработка
  # (не от pull request) и само ако всички проверки са минали. Не изпълнява нищо от кода на
  # клона — сваля само PNG файловете (artifact-а от checks). Един клон за всички: всеки push
  # го презаписва изцяло (commit-ът назовава sha и клона; push -f е атомарен — печели
  # последният). Групата е за клона на кода: обща група за всички клонове би отменяла
  # чакащите публикувания, а отменена задача прави цялата проверка „cancelled“ (за main —
  # без автоматично издание).
  publish-screenshots:
    needs: checks
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || startsWith(github.ref_name, 'claude/') || startsWith(github.ref_name, 'wave'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-screenshots-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        id: shots
        continue-on-error: true
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Publish screenshots
        if: steps.shots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ runner.temp }}/screenshots
        run: |
          if ! ls "$D"/*.png >/dev/null 2>&1; then echo "Няма снимки."; exit 0; fi
          {
            echo "# Снимки на екраните"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` (\`${GITHUB_REF_NAME}\`), генерирани от \`ScreenshotTest\` (Robolectric, примерни данни)."
            echo
            for f in "$D"/*.png; do n=$(basename "$f"); echo "### $n"; echo; echo "<img src=\"$n\" width=\"360\">"; echo; done
          } > "$D/README.md"
          cd "$D"
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # Подписаният build — едва след като проверките са минали: истинският ключ (в main) не
  # подписва commit с паднали тестове. (Условието на checks важи и тук: пропусната ли е,
  # пропуска се и release.)
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Подписване. Истинският upload ключ (GitHub Secrets) се ползва САМО в main — при push
      # и при ръчно пускане от main. Работните клонове (claude/**, wave*/**) и pull request-ите
      # винаги подписват с временен ключ ci-test (валиден 1 ден; проверява само, че подписаният
      # build работи — такъв AAB НЕ се качва в Google Play): изразите по-долу там дават празен
      # низ, т.е. secrets не стигат до средата и код от непроверен клон (Gradle скрипт, тест,
      # плъгин) не може да ги прочете или изнесе. Паролите са само в средата на тази стъпка (не
      # в GITHUB_ENV), а keystore файлът се изтрива след build-а. Изданията (release.yml през
      # auto-release.yml) вървят от main и също ползват истинския ключ.
      # AAB за Google Play = prodPlay (без самообновяване); APK за директно
      # инсталиране = prodRelease (със самообновяване от GitHub Releases).
      - name: Release AAB (Play) + APK (prod)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.UPLOAD_KEYSTORE_BASE64 || '' }}
          UPLOAD_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.UPLOAD_STORE_PASSWORD || '' }}
          UPLOAD_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.UPLOAD_KEY_ALIAS || '' }}
          UPLOAD_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.UPLOAD_KEY_PASSWORD || '' }}
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
            export SIGNING_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" SIGNING_KEY_ALIAS="$UPLOAD_KEY_ALIAS" SIGNING_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
            KIND=upload
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$SIGNING_STORE_FILE" -storepass "$PASS" -keypass "$PASS" \
              -alias ci-test -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI test key, O=not for release"
            export SIGNING_STORE_PASSWORD="$PASS" SIGNING_KEY_ALIAS=ci-test SIGNING_KEY_PASSWORD="$PASS"
            KIND=ci-test-only
          fi
          unset UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD
          echo "SIGNING_KIND=$KIND" >> "$GITHUB_ENV"
          # Без daemon: паролите не остават в процес, който живее след стъпката.
          ./gradlew --no-daemon bundleProdPlay assembleProdRelease

      - name: Verify release signature and Play manifest
        run: |
          jarsigner -verify app/build/outputs/bundle/prodPlay/app-prod-play.aab | tail -1
          echo "Signed with: $SIGNING_KIND"
          M=app/build/intermediates/merged_manifest/prodPlay/processProdPlayMainManifest/AndroidManifest.xml
          [ -f "$M" ] || M=$(find app/build/intermediates -path '*prodPlay*' -name AndroidManifest.xml | head -1)
          if grep -q "REQUEST_INSTALL_PACKAGES\|UpdateInstallReceiver" "$M"; then
            echo "::error::Play build must not contain self-update"; exit 1
          fi
          echo "Play manifest OK ($M)"
          # Символите на native библиотеките за Google Play. Сегашните .so (Compose graphics-path,
          # DataStore, CameraX) идват от AAR-и вече без символи — тогава няма какво да се вгради
          # и Play Console само информира; не е грешка на изданието.
          if unzip -l app/build/outputs/bundle/prodPlay/app-prod-play.aab | grep "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"; then
            echo "Native debug symbols included"
          else
            echo "::notice::No native debug symbols in the AAB (prebuilt stripped .so from AndroidX)"
          fi

      # ВРЕМЕННО (wave14/widget): размерът на APK-то по части — за сравнение с v1.2.27.
      - name: APK size (temporary)
        run: |
          python3 - <<'EOF'
          import zipfile, os
          p = "app/build/outputs/apk/prod/release/app-prod-release.apk"
          z = zipfile.ZipFile(p)
          tot = {}
          for i in z.infolist():
              n = i.filename
              k = "dex" if n.endswith(".dex") else "res/" if n.startswith("res/") else n if n == "resources.arsc" else "other"
              c = tot.setdefault(k, [0, 0, 0]); c[0] += 1; c[1] += i.compress_size; c[2] += i.file_size
          print("APK", os.path.getsize(p), "entries", len(z.infolist()))
          for k, v in tot.items(): print("APKPART", k, v)
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.SIGNING_KIND }}
          path: |
            app/build/outputs/bundle/prodPlay/*.aab
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/mapping/prodRelease/mapping.txt
            app/build/outputs/mapping/prodPlay/mapping.txt

  # Отчет на Compose компилатора (стабилност, skippable/restartable) за prodRelease — само
  # при ръчно пускане (Actions → Android CI → Run workflow): прекомпилира release Kotlin
  # с други флагове и не е проверка. Конфигурацията: compose-stability.conf.
  compose-reports:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compose compiler reports (prodRelease)
        continue-on-error: true
        run: |
          ./gradlew :app:compileProdReleaseKotlin --rerun -PcomposeReports=true
          python3 - <<'PY'
          import glob, json, os, re
          d = "app/build/compose_compiler"
          out = ["## Compose compiler (prodRelease)", ""]
          for f in sorted(glob.glob(f"{d}/*-module.json")):
              m = json.load(open(f, encoding="utf-8"))
              for k in ("totalComposables", "restartableComposables", "skippableComposables",
                        "knownStableArguments", "knownUnstableArguments", "unknownStableArguments", "totalArguments"):
                  if k in m:
                      out.append(f"- {k}: {m[k]}")
          for f in sorted(glob.glob(f"{d}/*-classes.txt")):
              unstable = re.findall(r"^unstable class (\S+)", open(f, encoding="utf-8").read(), re.M)
              out += ["", f"**Unstable classes ({len(unstable)})**", ""] + [f"- `{c}`" for c in unstable[:50]]
          for f in sorted(glob.glob(f"{d}/*-composables.txt")):
              fn, non_skippable, unstable_params = None, [], []
              for line in open(f, encoding="utf-8"):
                  m = None if line[:1].isspace() else re.match(r"^(.*?)\bfun (\S+?)\(", line)
                  if m:
                      head, fn = m.group(1), m.group(2)
                      if head.startswith("restartable") and "skippable" not in head:
                          non_skippable.append(fn)
                  elif line.lstrip().startswith("unstable ") and fn:
                      unstable_params.append(f"{fn}({line.split()[1].rstrip(':')})")
              out += ["", f"**Restartable but not skippable ({len(non_skippable)})**", ""] + [f"- `{n}`" for n in non_skippable[:50]]
              out += ["", f"**Unstable parameters ({len(unstable_params)})**", ""] + [f"- `{p}`" for p in unstable_params[:50]]
          if len(out) == 2:
              out.append("No reports found in app/build/compose_compiler.")
          text = "\n".join(out) + "\n"
          print(text)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                  s.write(text)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-compiler-reports
          path: app/build/compose_compiler/
          if-no-files-found: ignore
