name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (напр. 1.0.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "Какво ново (BG, по ред на точка). Празно — от store/whats-new.md или общият текст"
        required: false
        default: ""
      notes_en:
        description: "What's new (EN). Празно — от store/whats-new.md или общият текст"
        required: false
        default: ""
      allow_debug_key:
        description: "Само за тест: без signing secrets подписва с временен CI ключ (без update.json)"
        type: boolean
        required: false
        default: false
      draft:
        description: "Създай изданието като чернова (публикува се ръчно)"
        type: boolean
        required: false
        default: false
  push:
    tags: ["v*"]
  # Извиква се от auto-release.yml (автоматично издание след сливане в main).
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      # Текстът за читателите (BG/EN). Празно — от store/whats-new.md или общият текст.
      notes:
        type: string
        required: false
        default: ""
      notes_en:
        type: string
        required: false
        default: ""
      # Техническият списък с промени (commit-и) — само в описанието на GitHub Release.
      changes:
        type: string
        required: false
        default: ""
      ref:
        description: "Commit за издаване"
        type: string
        required: false
        default: ""
      draft:
        description: "Чернова: изданието се публикува ръчно (напр. само обновени зависимости)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Едно издание наведнъж. GitHub пази само едно чакащо пускане на група (при ново отменя
# чакащото), затова push на tag (напр. от публикувана чернова — guard-ът тогава не прави
# нищо) е в собствена група и не може да измести чакащо издание от auto-release.yml.
concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  # Публикуването на чернова от уеб интерфейса създава tag-а и може да пусне това
  # събитие (push на v*) — тогава изданието вече съществува и не се строи наново.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          SKIP=false
          if [ "$EVENT" = "push" ] && \
             [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "Изданието $TAG вече е публикувано — без нов build."
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # versionCode расте монотонно независимо кой workflow издава: минути от 01.01.2024.
          echo "VERSION_CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))" >> "$GITHUB_ENV"

      # „Какво ново“ за читателите (update.json → диалогът за нова версия и листът след
      # обновяване): ръчно въведеният текст, иначе най-горният раздел на store/whats-new.md
      # (ако е за тази версия и още не е ползван — виж tools/whats_new.py), иначе общото
      # „Подобрения и поправки.“. Никога списъкът с commit-и — той е само в описанието на изданието.
      - name: What's new
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          NOTES_EN: ${{ inputs.notes_en }}
        run: |
          mkdir -p "$RUNNER_TEMP/whats-new"
          # Издадените версии (и черновите) — раздел за вече издадена версия не се ползва пак.
          # Без отговор от API файлът липсва и разделът важи само при точно съвпадение на версията.
          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/released.part"; then
            mv "$RUNNER_TEMP/released.part" "$RUNNER_TEMP/released.txt"
          fi
          # По-стар commit без скрипта (или грешка в него) — общият текст, изданието не спира.
          if ! python3 tools/whats_new.py "$VERSION" store/whats-new.md "$RUNNER_TEMP/released.txt" "$RUNNER_TEMP/whats-new"; then
            echo "Подобрения и поправки." > "$RUNNER_TEMP/whats-new/notes.bg.txt"
            echo "Improvements and fixes." > "$RUNNER_TEMP/whats-new/notes.en.txt"
          fi
          if [ -n "${NOTES//[[:space:]]/}" ]; then printf '%s\n' "$NOTES" > "$RUNNER_TEMP/whats-new/notes.bg.txt"; fi
          if [ -n "${NOTES_EN//[[:space:]]/}" ]; then printf '%s\n' "$NOTES_EN" > "$RUNNER_TEMP/whats-new/notes.en.txt"; fi
          echo "WHATS_NEW_DIR=$RUNNER_TEMP/whats-new" >> "$GITHUB_ENV"

      # Истинският upload ключ — само за издания от main (автоматичните през auto-release.yml,
      # ръчните от main) и от tag-ове v*. Ръчно пускане от друг клон не получава secrets и без
      # allow_debug_key спира тук с грешка.
      # При auto-release (workflow_run) github.ref е клонът по подразбиране на хранилището (main,
      # защитен — влиза само код със зелен „checks“), не клонът на кода — затова се гледа и
      # клонът на проверката, след която тръгва изданието (auto-release.yml проверява и че
      # commit-ът е последният в main). Двете условия днес съвпадат; второто пази, ако клонът по
      # подразбиране някога пак не е main. При workflow_run GitHub пуска файловете
      # (auto-release.yml и този) от клона по подразбиране.
      # Тук secrets не влизат в средата — само дали ги има; паролите получава единствено
      # стъпката „Build release“.
      - name: Signing key
        env:
          TRUSTED: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
          HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' && secrets.UPLOAD_STORE_PASSWORD != '' }}
          ALLOW_DEBUG_KEY: ${{ inputs.allow_debug_key }}
        run: |
          if [ "$TRUSTED" = "true" ] && [ "$HAS_UPLOAD_KEY" = "true" ]; then
            echo "SIGNING_KIND=upload-key" >> "$GITHUB_ENV"
          elif [ "$ALLOW_DEBUG_KEY" = "true" ]; then
            # Само при изрично ръчно пускане с allow_debug_key: true (тест на pipeline-а).
            echo "SIGNING_KIND=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "::error::Липсват signing secrets (UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD) или изданието не е от main / tag v* (ref: ${{ github.ref }}, събитие: ${{ github.event_name }}). Издание с временен ключ не може да обнови инсталираните приложения и не става за Google Play. За тест пуснете ръчно с allow_debug_key: true."
            exit 1
          fi

      - name: Tests and lint
        run: |
          (cd shared && ../gradlew --no-daemon test)
          ./gradlew --no-daemon testProdDebugUnitTest lintProdRelease

      # Паролите — само в средата на тази стъпка (не в GITHUB_ENV), keystore файлът се изтрива
      # след build-а. Извън доверените издания изразите дават празен низ (без secrets).
      - name: Build release
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && secrets.UPLOAD_KEYSTORE_BASE64 || '' }}
          UPLOAD_STORE_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && secrets.UPLOAD_STORE_PASSWORD || '' }}
          UPLOAD_KEY_ALIAS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && secrets.UPLOAD_KEY_ALIAS || '' }}
          UPLOAD_KEY_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && secrets.UPLOAD_KEY_PASSWORD || '' }}
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          if [ "$SIGNING_KIND" = "upload-key" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
            export SIGNING_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" SIGNING_KEY_ALIAS="$UPLOAD_KEY_ALIAS" SIGNING_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$SIGNING_STORE_FILE" -storepass "$PASS" -keypass "$PASS" \
              -alias ci-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI test key, O=not for Google Play"
            export SIGNING_STORE_PASSWORD="$PASS" SIGNING_KEY_ALIAS=ci-test SIGNING_KEY_PASSWORD="$PASS"
          fi
          unset UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          ./gradlew --no-daemon bundleProdPlay assembleProdRelease assembleDevDebug
          mkdir -p dist
          cp app/build/outputs/bundle/prodPlay/app-prod-play.aab "dist/chitalishte-yavorets-$VERSION.aab"
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "dist/chitalishte-yavorets-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # Dev debug APK (с ДЕМО данни) — само като CI артефакт, не в публичното издание.
          mkdir -p dev-dist
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk "dev-dist/chitalishte-yavorets-$VERSION-dev-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: dev-debug-apk-${{ env.VERSION }}
          path: dev-dist/*.apk
          retention-days: 30

      # update.json — по него инсталираните APK-та откриват новата версия
      # (https://github.com/<repo>/releases/latest/download/update.json).
      # Публикува се САМО при постоянен ключ: APK, подписан с различен (временен)
      # ключ, не може да замени инсталираното приложение.
      # „notes“ е на български (старите версии на приложението четат само него), „notes_en“ —
      # на английски; приложението избира по езика на интерфейса.
      - name: Update manifest
        if: env.SIGNING_KIND == 'upload-key'
        run: |
          python3 - <<'PY'
          import json, os, hashlib
          v = os.environ["VERSION"]; apk = f"dist/chitalishte-yavorets-{v}.apk"
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = lambda lang: open(os.path.join(os.environ["WHATS_NEW_DIR"], f"notes.{lang}.txt"), encoding="utf-8").read().strip()
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": v,
              "apkUrl": f"https://github.com/{repo}/releases/download/v{v}/chitalishte-yavorets-{v}.apk",
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "minSdk": 26,
              "notes": notes("bg"),
              "notes_en": notes("en"),
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v{v}",
          }
          json.dump(data, open("dist/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Release notes
        env:
          CHANGES: ${{ inputs.changes }}
        run: |
          NOTES=$(cat "$WHATS_NEW_DIR/notes.bg.txt")
          NOTES_EN=$(cat "$WHATS_NEW_DIR/notes.en.txt")
          cat > notes.md <<NOTES
          Читалище Яворец — Android приложение v$VERSION (versionCode $VERSION_CODE)

          Какво ново:
          $NOTES

          What's new:
          $NOTES_EN

          Файлове:
          - chitalishte-yavorets-$VERSION.apk — инсталиране директно на телефон (Android 8.0+); обновява се автоматично
          - chitalishte-yavorets-$VERSION.aab — за Google Play (обновява се от Google Play)
          - SHA256SUMS.txt — контролни суми

          Подпис: $SIGNING_KIND
          NOTES
          if [ "$SIGNING_KIND" = "ci-test-key" ]; then
            echo "" >> notes.md
            echo "⚠ Без update.json: автоматичното обновяване изисква постоянен ключ за подписване (secrets по-долу)." >> notes.md
            echo "⚠ Подписано с временен CI ключ — годно за тестове, НЕ за качване в Google Play. За Play добавете secrets UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD (виж README)." >> notes.md
          fi
          if [ -n "${CHANGES//[[:space:]]/}" ]; then
            printf '\nПромени (технически):\n%s\n' "$CHANGES" >> notes.md
          fi
          sed -i 's/^          //' notes.md

      # Чернова (draft) не се връща от /releases/latest, така че update.json не стига
      # до инсталираните приложения, докато човек не натисне „Publish release“.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          TAG="v$VERSION"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              # Съществуваща чернова (напр. от предишно издание само със зависимости):
              # обнови бележките и commit-а; публикувай я, ако вече има и други промени.
              if [ "$DRAFT" = "true" ]; then KEEP_DRAFT=true; else KEEP_DRAFT=false; fi
              gh release edit "$TAG" --notes-file notes.md --target "$TARGET" --draft="$KEEP_DRAFT"
            fi
          elif [ "$DRAFT" = "true" ]; then
            gh release create "$TAG" dist/* --draft --title "Читалище Яворец $VERSION" --notes-file notes.md --target "$TARGET"
            echo "::notice::Създадена чернова $TAG (само обновени зависимости) — публикувайте я ръчно от Releases."
          else
            gh release create "$TAG" dist/* --title "Читалище Яворец $VERSION" --notes-file notes.md --target "$TARGET"
          fi
