name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (напр. 1.0.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "Какво ново (показва се в приложението при обновяване)"
        required: false
        default: ""
      allow_debug_key:
        description: "Само за тест: без signing secrets подписва с временен CI ключ (без update.json)"
        type: boolean
        required: false
        default: false
      draft:
        description: "Създай изданието като чернова (публикува се ръчно)"
        type: boolean
        required: false
        default: false
  push:
    tags: ["v*"]
  # Извиква се от auto-release.yml (автоматично издание след сливане в main).
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: false
        default: ""
      ref:
        description: "Commit за издаване"
        type: string
        required: false
        default: ""
      draft:
        description: "Чернова: изданието се публикува ръчно (напр. само обновени зависимости)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Публикуването на чернова от уеб интерфейса създава tag-а и може да пусне това
  # събитие (push на v*) — тогава изданието вече съществува и не се строи наново.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          SKIP=false
          if [ "$EVENT" = "push" ] && \
             [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "Изданието $TAG вече е публикувано — без нов build."
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # versionCode расте монотонно независимо кой workflow издава: минути от 01.01.2024.
          echo "VERSION_CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))" >> "$GITHUB_ENV"

      - name: Tests and lint
        run: |
          (cd shared && ../gradlew --no-daemon test)
          ./gradlew --no-daemon testProdDebugUnitTest lintProdRelease

      - name: Prepare signing key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ALLOW_DEBUG_KEY: ${{ inputs.allow_debug_key }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=upload-key" >> "$GITHUB_ENV"
          elif [ "$ALLOW_DEBUG_KEY" = "true" ]; then
            # Само при изрично ръчно пускане с allow_debug_key: true (тест на pipeline-а).
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias ci-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI test key, O=not for Google Play"
            echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=ci-test" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "::error::Липсват signing secrets (UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD). Издание с временен ключ не може да обнови инсталираните приложения и не става за Google Play. За тест пуснете ръчно с allow_debug_key: true."
            exit 1
          fi
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          ./gradlew --no-daemon bundleProdPlay assembleProdRelease assembleDevDebug
          mkdir -p dist
          cp app/build/outputs/bundle/prodPlay/app-prod-play.aab "dist/chitalishte-yavorets-$VERSION.aab"
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "dist/chitalishte-yavorets-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # Dev debug APK (с ДЕМО данни) — само като CI артефакт, не в публичното издание.
          mkdir -p dev-dist
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk "dev-dist/chitalishte-yavorets-$VERSION-dev-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: dev-debug-apk-${{ env.VERSION }}
          path: dev-dist/*.apk
          retention-days: 30

      # update.json — по него инсталираните APK-та откриват новата версия
      # (https://github.com/<repo>/releases/latest/download/update.json).
      # Публикува се САМО при постоянен ключ: APK, подписан с различен (временен)
      # ключ, не може да замени инсталираното приложение.
      - name: Update manifest
        if: env.SIGNING_KIND == 'upload-key'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os, hashlib
          v = os.environ["VERSION"]; apk = f"dist/chitalishte-yavorets-{v}.apk"
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": v,
              "apkUrl": f"https://github.com/{repo}/releases/download/v{v}/chitalishte-yavorets-{v}.apk",
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "minSdk": 26,
              "notes": os.environ.get("NOTES", "").strip(),
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v{v}",
          }
          json.dump(data, open("dist/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          cat > notes.md <<NOTES
          Читалище Яворец — Android приложение v$VERSION (versionCode $VERSION_CODE)

          $NOTES

          Файлове:
          - chitalishte-yavorets-$VERSION.apk — инсталиране директно на телефон (Android 8.0+); обновява се автоматично
          - chitalishte-yavorets-$VERSION.aab — за Google Play (обновява се от Google Play)
          - SHA256SUMS.txt — контролни суми

          Подпис: $SIGNING_KIND
          NOTES
          if [ "$SIGNING_KIND" = "ci-test-key" ]; then
            echo "" >> notes.md
            echo "⚠ Без update.json: автоматичното обновяване изисква постоянен ключ за подписване (secrets по-долу)." >> notes.md
            echo "⚠ Подписано с временен CI ключ — годно за тестове, НЕ за качване в Google Play. За Play добавете secrets UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD (виж README)." >> notes.md
          fi
          sed -i 's/^          //' notes.md

      # Чернова (draft) не се връща от /releases/latest, така че update.json не стига
      # до инсталираните приложения, докато човек не натисне „Publish release“.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          TAG="v$VERSION"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              # Съществуваща чернова (напр. от предишно издание само със зависимости):
              # обнови бележките и commit-а; публикувай я, ако вече има и други промени.
              if [ "$DRAFT" = "true" ]; then KEEP_DRAFT=true; else KEEP_DRAFT=false; fi
              gh release edit "$TAG" --notes-file notes.md --target "$TARGET" --draft="$KEEP_DRAFT"
            fi
          elif [ "$DRAFT" = "true" ]; then
            gh release create "$TAG" dist/* --draft --title "Читалище Яворец $VERSION" --notes-file notes.md --target "$TARGET"
            echo "::notice::Създадена чернова $TAG (само обновени зависимости) — публикувайте я ръчно от Releases."
          else
            gh release create "$TAG" dist/* --title "Читалище Яворец $VERSION" --notes-file notes.md --target "$TARGET"
          fi
