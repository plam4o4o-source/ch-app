name: Self-update test (temporary)
on:
  push:
    branches: [debug/update-test]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Download published v1.2.10 APK
        run: curl -fsSL -o old.apk https://github.com/plam4o4o-source/ch-app/releases/download/v1.2.10/chitalishte-yavorets-1.2.10.apk && ls -l old.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/update-test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: update-test
          path: out/
