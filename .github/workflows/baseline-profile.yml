name: Baseline profile

# Генерира Baseline + Startup профила на приложението на емулатор (Macrobenchmark,
# модулът :baselineprofile) и го предлага за сливане:
#   1) артефакт „baseline-profile“ с baseline-prof.txt и startup-prof.txt;
#   2) commit в клона baseline-profile/update (презаписва се при всяко пускане).
# Клонът се слива в main ръчно (PR от уеб интерфейса): той обновява
# app/src/main/generated/baselineProfiles/ (и премахва стария ръчен app/src/main/baseline-prof.txt
# с wildcard правилата, ако още го има).
# Push с GITHUB_TOKEN не пуска други workflow-и — Android CI тръгва при отварянето на PR-а.

on:
  workflow_dispatch:
  schedule:
    # Всяка неделя, 02:23 UTC (по-рано от седмичните Dependabot обновления в понеделник).
    - cron: "23 2 * * 0"

permissions:
  contents: write

concurrency:
  group: baseline-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Сглобяване преди емулатора (по-малко време с вървящ емулатор). nonMinifiedRelease
      # се създава от Baseline Profile плъгина; без ограничението до ARM (виж app/build.gradle.kts),
      # така че APK-ът съдържа и x86_64 native библиотеките за емулатора.
      - name: Build app and profile generator
        run: ./gradlew --no-daemon :app:assembleProdNonMinifiedRelease :baselineprofile:assembleProdNonMinifiedRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # BaselineProfileRule: API 33+ (без root). Анимациите остават включени — кодът им
      # също трябва да влезе в профила.
      - name: Generate baseline + startup profile on emulator
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:generateBaselineProfile

      # При неуспех — причината направо в лога (артефактите не винаги са удобни за преглед):
      # резултатите от инструментацията и краят на logcat за всеки тест.
      - name: Show test failures
        if: failure()
        run: |
          R=baselineprofile/build/outputs/androidTest-results
          [ -d "$R" ] || { echo "no test results"; exit 0; }
          find "$R" -name '*.xml' -print -exec grep -h -A40 '<failure' {} + || true
          find "$R" -name 'logcat-*.txt' | while read -r f; do
            echo "::group::$f"
            grep -E 'AndroidRuntime|FATAL|BaselineProfile|TestRunner|Benchmark|lowmemorykiller|am_crash|ANR' "$f" | tail -n 200 || true
            echo "::endgroup::"
          done

      - name: Check generated profile
        run: |
          D=app/src/main/generated/baselineProfiles
          ls -la "$D"
          test -s "$D/baseline-prof.txt" || { echo "::error::baseline-prof.txt was not generated"; exit 1; }
          echo "baseline-prof.txt: $(wc -l < "$D/baseline-prof.txt") rules"
          [ -f "$D/startup-prof.txt" ] && echo "startup-prof.txt: $(wc -l < "$D/startup-prof.txt") rules" || echo "::warning::startup-prof.txt missing"
          {
            echo "## Baseline profile"
            echo "- baseline-prof.txt: $(wc -l < "$D/baseline-prof.txt") rules"
            [ -f "$D/startup-prof.txt" ] && echo "- startup-prof.txt: $(wc -l < "$D/startup-prof.txt") rules"
            echo "- branch: \`baseline-profile/update\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profile-test-outputs
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          if-no-files-found: ignore

      - name: Commit to branch baseline-profile/update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B baseline-profile/update
          git add app/src/main/generated/baselineProfiles
          # Генерираният профил заменя ръчния с wildcard правила.
          if [ -f app/src/main/baseline-prof.txt ]; then git rm -q app/src/main/baseline-prof.txt; fi
          if git diff --cached --quiet; then
            echo "Profile unchanged — nothing to commit."
            exit 0
          fi
          git commit -q -m "Baseline profile: generated on emulator from ${GITHUB_SHA::7}"
          git push -f origin baseline-profile/update
          echo "Pushed: https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...baseline-profile/update"
