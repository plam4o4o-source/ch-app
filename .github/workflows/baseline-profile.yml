name: Baseline profile

# Генерира Baseline + Startup профила на приложението на емулатор (Macrobenchmark, модулът
# :baselineprofile) и го слива в main САМ, ако пълната проверка мине:
#   1) генериране на емулатор (Android 13, при неуспех — още един опит на Android 14; на 15
#      емулаторът в CI замръзва при превъртане на „Начало“);
#   2) проверка на покритието (.github/scripts/baseline-profile-check.sh): всеки ключов екран
#      има правила и общият брой не е паднал с над 15% спрямо профила в Git — иначе профилът
#      се отхвърля (напр. път, който изкарва приложението на заден план, губи всички следващи);
#   3) commit в клона baseline-profile/update (от последния main);
#   4) Android CI на този commit (workflow_dispatch — push с GITHUB_TOKEN не пуска workflow-и);
#   5) ако „checks“ е зелен — main се придвижва напред до този commit (fast-forward с тайната
#      PROFILE_PUSH_TOKEN; без нея профилът чака в клона за ръчно сливане). Ако междувременно
#      main е мръднал — commit-ът се пренася върху новия main и стъпки 4–5 се повтарят веднъж.
# Неуспех на която и да е стъпка не пипа main — остава предишният профил (и изданието излиза
# с него, с предупреждение — виж release-profile.sh).
# Стъпки 3–5 са в отделна задача „merge“: чисто копие на хранилището и профилът от artifact-а
# на „generate“. Задачата, която пуска Gradle и емулатора (т.е. код от хранилището), има само
# право за четене и не вижда PROFILE_PUSH_TOKEN.
# Само профил не прави нова версия (виж auto-release.yml).
#
# Кога: всяка неделя, ръчно и ПРЕДИ издание — Auto release го пуска (workflow_dispatch от
# main) и чака новия профил, ако кодът на приложението е променен след commit-а, от който е
# генериран сегашният (виж auto-release.yml, задачата „profile“). Така изданието съдържа
# профил от собствения си код, а не от предишното издание.
#
# Ръчно пускане от друг клон (напр. за проверка на нови пътища в Journeys.kt) само генерира
# профила, показва броя правила за ключовите екрани и резултата на всеки път (logcat) и го
# качва като artifact — без commit и без сливане в main (тогава се проверява и кодът, и
# генераторът от този клон).

on:
  workflow_dispatch:
  schedule:
    # Всяка неделя, 02:23 UTC (по-рано от седмичните Dependabot обновления в понеделник).
    - cron: "23 2 * * 0"

permissions:
  contents: read

# Пусканията от main — едно по едно; проверка от друг клон — в собствена група (не измества
# чакащо пускане от main, напр. това, което Auto release чака).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'baseline-profile' || format('baseline-profile-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Само четене, и токенът не остава в .git/config: Gradle, тестовете и емулаторът изпълняват
    # код от хранилището. Commit-ът и сливането са в задачата „merge“.
    permissions:
      contents: read
    env:
      FROM_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # Точно commit-ът на пускането (github.sha): при schedule — последният в main, при
      # ръчно пускане — върхът на избрания клон. Профилът в него е мярката за проверката.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Сглобяване преди емулатора (по-малко време с вървящ емулатор). nonMinifiedRelease
      # се създава от Baseline Profile плъгина; без ограничението до ARM (виж app/build.gradle.kts),
      # така че APK-ът съдържа и x86_64 native библиотеките за емулатора.
      - name: Build app and profile generator
        run: ./gradlew --no-daemon :app:assembleProdNonMinifiedRelease :baselineprofile:assembleProdNonMinifiedRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Компилаторът на Kotlin (демон от стъпката за сглобяване) повече не трябва — паметта
      # на runner-а остава за емулатора.
      - name: Free memory for the emulator
        run: |
          pkill -f KotlinCompileDaemon || true
          free -m

      # BaselineProfileRule: API 33+ (без root). Анимациите остават включени — кодът им
      # също трябва да влезе в профила. Не 35: там емулаторът в CI замръзва при превъртане
      # на „Начало“ (и при стари версии на приложението — проблем на емулатора), а генераторът
      # превърта точно него. GPU: swangle_indirect — със swiftshader_indirect емулаторът
      # изчезва (adb: device not found) минута-две след старта на приложението. 4 ядра,
      # а при неуспех — още един опит с нов емулатор на API 34.
      - name: Generate baseline + startup profile on emulator
        id: generate
        continue-on-error: true
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:generateBaselineProfile

      # При неуспех — причината направо в лога (виж скрипта).
      - name: Show test failures (first attempt)
        if: steps.generate.outcome == 'failure'
        run: bash .github/scripts/baseline-profile-diagnostics.sh

      - name: Generate baseline + startup profile on emulator (retry)
        if: steps.generate.outcome == 'failure'
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:generateBaselineProfile

      - name: Show test failures
        if: failure()
        run: bash .github/scripts/baseline-profile-diagnostics.sh

      # Кои пътища са минали („journey <име>: ok / incomplete / failed“) и бележките им.
      - name: Journeys (logcat)
        if: always()
        run: |
          find baselineprofile/build/outputs -name 'logcat-*.txt' 2>/dev/null | sort | while read -r f; do
            echo "::group::$f"
            grep -E ' BaselineProfile *:' "$f" | sed -E 's/^.* BaselineProfile *: //' || true
            echo "::endgroup::"
            echo "$(basename "$f"): $(grep -cE 'BaselineProfile *: journey .*: ok ' "$f" || true) ok," \
              "$(grep -cE 'BaselineProfile *: journey .*: (incomplete|failed) ' "$f" || true) incomplete/failed"
          done

      # Броят правила за ключовите екрани; профил без някой от тях (или с много по-малко
      # правила от сегашния) се отхвърля — main остава с предишния.
      - name: Check generated profile
        run: |
          ls -la app/src/main/generated/baselineProfiles
          bash .github/scripts/baseline-profile-check.sh
          if [ "$FROM_MAIN" = "true" ]; then
            echo "- към клона \`baseline-profile/update\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- от \`$GITHUB_REF_NAME\` — само artifact, без commit" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Профилът за задачата „merge“ (и за преглед) — само ако проверката е минала.
      - uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profile-test-outputs
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          if-no-files-found: ignore

  # Commit и сливане — само от main (профил, генериран от друг клон, никога не стига до main)
  # и само с проверен профил. Без Gradle и без емулатор: чисто копие на commit-а на пускането,
  # профилът — от artifact-а на „generate“, git hooks са изключени.
  merge:
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles

      - name: Commit to branch baseline-profile/update
        id: commit
        run: |
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B baseline-profile/update
          git add app/src/main/generated/baselineProfiles
          # Генерираният профил заменя ръчния с wildcard правила.
          if [ -f app/src/main/baseline-prof.txt ]; then git rm -q app/src/main/baseline-prof.txt; fi
          if git diff --cached --quiet; then
            echo "Profile unchanged — nothing to merge."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Профил за бърз старт: генериран на емулатор от ${GITHUB_SHA::7}"
          git push -f origin baseline-profile/update
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Пълната проверка на commit-а с профила; при зелен „checks“ — main напред до него.
      # Ако main е мръднал, докато вървят проверките — пренасяне и още един опит.
      - name: Check and merge into main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PROFILE_PUSH_TOKEN }}
        run: bash .github/scripts/baseline-profile-merge.sh
