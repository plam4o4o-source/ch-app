name: Full emulator test (temporary)
# ВРЕМЕННО: пълна проверка на release build-а на емулатор. Резултатите (снимки, логове,
# числа) се публикуват в клона emulator-results (orphan, force-push).
on:
  push:
    branches: [debug/full-test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build minified prodRelease APK (throwaway key)
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/t.jks" -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 1 -dname "CN=repro"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/t.jks" SIGNING_STORE_PASSWORD="$PASS" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$PASS"
          ./gradlew --no-daemon assembleProdRelease
          cp "$(ls app/build/outputs/apk/prod/release/*.apk | head -1)" app.apk && ls -l app.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (part ${{ matrix.part }})
        timeout-minutes: 38
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Без камера: емулаторът пада при отваряне на камерата.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/perf-check/run.sh ${{ matrix.part }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-${{ matrix.part }}
          path: out/

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: out-*
          path: results
          merge-multiple: true
      - name: Push results to emulator-results (orphan, force)
        run: |
          set -e
          SRC=$(git rev-parse --short HEAD)
          mkdir -p "$RUNNER_TEMP/pub" && cp -r results/. "$RUNNER_TEMP/pub/"
          cd "$RUNNER_TEMP/pub"
          {
            echo "# Emulator results"
            echo
            echo "Source: \`debug/full-test\` @ $SRC, run ${{ github.run_id }} (attempt ${{ github.run_attempt }}), $(date -u +%FT%TZ)."
            echo "Emulator: API 35 google_apis x86_64, pixel_6 profile, swiftshader (software rendering)."
            echo
            for p in a b; do
              [ -f "$p/summary.txt" ] || { echo "## Part $p: no summary (job failed?)"; continue; }
              echo "## Part $p summary"; echo; echo '```'; cat "$p/summary.txt"; echo '```'; echo
            done
            echo "## Screenshots"
            for d in $(find . -name '*.png' -printf '%h\n' | sort -u); do
              echo; echo "### ${d#./}"; echo
              for f in $(ls "$d"/*.png | sort); do echo "- [${f#./}](${f#./})"; done
            done
            echo; echo "## Other files"; echo
            find . -type f ! -name '*.png' ! -name index.md | sort | sed 's|^\./||; s|.*|- [&](&)|'
          } > index.md
          git init -q -b emulator-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator results for $SRC (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/emulator-results
