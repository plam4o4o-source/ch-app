name: Full emulator test v1.2.27 (temporary)
# ВРЕМЕННО: пълна проверка на издадената v1.2.27 (origin/main 8dc63c1) на емулатор, със
# сравнение с v1.2.26 (3df7f37). Резултатите (снимки, логове, числа) се публикуват в клона
# emulator-results, папка v127b/ (orphan, force-push; останалото съдържание на клона се запазва).
# Стъпките с емулатора са continue-on-error: паднал емулатор се записва в резултатите,
# а изпълнението завършва зелено (без писма за неуспех).
#
# Изданията се строят като в release.yml (versionCode 1484479 и versionName на изданието), с
# временен ключ, общ за всички APK-та. За „Какво ново“ — още един v1.2.26 с versionCode 1484478,
# който търси update.json в emulator-results/v127b/update/ (там е v1.2.27, със същия ключ).
on:
  push:
    branches: [debug/full-test-3]
permissions:
  contents: read
env:
  NEW_REF: 8dc63c14cd5825e8fcad183492c873eb9cbb68de
  BASE_REF: 3df7f373e5dfdef0511a3dcdfa8f573c2161b8ce
  VC: "1484479"
  VC_OLD: "1484478"
jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Throwaway signing key, shared by all test APKs
        run: |
          mkdir key; PASS=$(openssl rand -hex 16); echo "$PASS" > key/pass
          keytool -genkeypair -noprompt -keystore key/t.jks -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 3 -dname "CN=emulator test, O=not for release"
      - uses: actions/upload-artifact@v7
        with:
          name: key
          path: key/
          retention-days: 1

  build:
    needs: key
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: new, vname: "1.2.27" }
          - { app: base, vname: "1.2.26" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.app == 'new' && env.NEW_REF || env.BASE_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: key
          path: ${{ runner.temp }}/key
      - name: Temporary x86_64 ABI and versionName (emulator only, not committed)
        run: |
          sed -i 's|^val releaseAbis = listOf("arm64-v8a", "armeabi-v7a")$|val releaseAbis = listOf("arm64-v8a", "armeabi-v7a", "x86_64") // ВРЕМЕННО|' app/build.gradle.kts
          sed -i 's/versionName = ".*"/versionName = "${{ matrix.vname }}"/' app/build.gradle.kts
          grep -nE '^val releaseAbis|versionName = ' app/build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build minified prodRelease APK
        run: |
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=$VC
          ./gradlew --no-daemon assembleProdRelease
          mkdir -p dist
          if [ ${{ matrix.app }} = new ]; then N=app; R=apk-ref; else N=app-base; R=apk-base-ref; fi
          cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/$N.apk
          echo "${{ matrix.vname }} $(git rev-parse --short HEAD) ($(git log -1 --format=%s | cut -c1-70)); versionCode $VC; x86_64 libs: $(unzip -l dist/$N.apk | grep -c 'lib/x86_64/' || true)" > dist/$R.txt
          cat dist/$R.txt; ls -l dist
      - name: Build the update-source APK (v1.2.26, older versionCode, staged update.json)
        if: matrix.app == 'base'
        run: |
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=$VC_OLD
          export UPDATE_MANIFEST_URL="https://raw.githubusercontent.com/${{ github.repository }}/emulator-results/v127b/update/update.json"
          ./gradlew --no-daemon assembleProdRelease
          cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/app-base-upd.apk
          echo "${{ matrix.vname }} $(git rev-parse --short HEAD); versionCode $VC_OLD; update manifest $UPDATE_MANIFEST_URL" > dist/apk-base-upd-ref.txt
          cat dist/apk-base-upd-ref.txt; ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app }}
          path: dist/

  # v1.2.27 и update.json в emulator-results/v127b/update/ — за самообновяването в частта update.
  stage-update:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk-new
          path: dist
      - name: Stage update.json + APK (orphan, force; the rest of the branch is kept)
        continue-on-error: true
        run: |
          set -e
          R="https://github.com/${{ github.repository }}.git"
          mkdir -p "$RUNNER_TEMP/pub"; cd "$RUNNER_TEMP/pub"
          git init -q -b emulator-results
          if git fetch -q --depth 1 "$R" emulator-results; then git archive FETCH_HEAD | tar -x; fi
          mkdir -p v127b/update; cp "$GITHUB_WORKSPACE/dist/app.apk" v127b/update/app.apk
          curl -sSL --retry 3 -o "$RUNNER_TEMP/real.json" "https://github.com/${{ github.repository }}/releases/download/v1.2.27/update.json"
          python3 - "$RUNNER_TEMP/real.json" <<'PY'
          import hashlib, json, os, sys
          real = json.load(open(sys.argv[1], encoding="utf-8"))
          apk = "v127b/update/app.apk"
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "versionCode": int(os.environ["VC"]),
              "versionName": "1.2.27",
              "apkUrl": f"https://raw.githubusercontent.com/{repo}/emulator-results/v127b/update/app.apk",
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "minSdk": 26,
              "notes": real["notes"],
              "notes_en": real.get("notes_en", ""),
              "releaseUrl": real.get("releaseUrl", ""),
          }
          json.dump(data, open("v127b/update/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Stage the v1.2.27 test update for the v127b emulator run (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/emulator-results

  emulator:
    needs: [build, stage-update]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Всички на API 33 със swangle_indirect (swiftshader_indirect срива емулатора).
        part: [abstart-1, abstart-2, jank-1, jank-2, mem, mem-base, monkey, media, rot, offline,
               look1, look2, look3, func1, func2, update]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l *.apk; cat apk-*.txt
      - name: Run on emulator (${{ matrix.part }}, API 33, swangle_indirect)
        id: run
        continue-on-error: true
        timeout-minutes: 62
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Без камера: емулаторът пада при отваряне на камерата.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/perf-check/run.sh ${{ matrix.part }}
      - name: Record the step outcome
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/${{ matrix.part }}
          echo "part=${{ matrix.part }} api=33 gpu=swangle_indirect emulator-step=${{ steps.run.outcome }}" > out/${{ matrix.part }}/job-status.txt
          cat out/${{ matrix.part }}/job-status.txt
          { echo "== free"; free -m; echo "== host kernel: oom / kvm / segfault"; sudo dmesg -T | grep -iE "oom|killed process|kvm|segfault|qemu|trap" | tail -40
            echo "== emulator processes"; ps -eo pid,etime,rss,stat,args | grep -iE "qemu|emulator" | grep -v grep | cut -c1-200
            echo "== emulator crash dumps / logs"; find /tmp ~/.android -newer app.apk \( -name '*.dmp' -o -name '*crash*' \) 2>/dev/null | head -20; } > out/${{ matrix.part }}/host-after-run.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: out-${{ matrix.part }}
          path: out/

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: out-*
          path: results
          merge-multiple: true
      - name: Push results to emulator-results/v127b (orphan, force; the rest of the branch is kept)
        continue-on-error: true
        run: |
          set -e
          SRC=$(git rev-parse --short HEAD)
          mkdir -p "$RUNNER_TEMP/pub" results
          if git fetch -q --depth 1 origin emulator-results; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/pub"; fi
          V="$RUNNER_TEMP/pub/v127b"
          # update.json остава за справка; самият APK — не.
          mkdir -p "$V"; find "$V" -mindepth 1 -maxdepth 1 ! -name update -exec rm -rf {} +; rm -f "$V/update/app.apk"
          cp -r results/. "$V/"
          cd "$V"
          PARTS=$(ls -d */ 2>/dev/null | tr -d / | grep -v '^update$' || true)
          {
            echo "# v1.2.27 full emulator test (released app, origin/main 8dc63c1)"
            echo
            echo "Source: \`debug/full-test-3\` @ $SRC (app = 8dc63c1, compared with v1.2.26 = 3df7f37), run ${{ github.run_id }} (attempt ${{ github.run_attempt }}), $(date -u +%FT%TZ)."
            echo "Emulators: google_apis x86_64 API 33, pixel_6 profile, -gpu swangle_indirect; app locale bg-BG (EN only in look1). APKs: minified prodRelease, x86_64 added, throwaway key, versionCode $VC."
            echo "Wave 13 check: [../v127/index.md](../v127/index.md) and [../v127/run2/index.md](../v127/run2/index.md). v1.2.26 full test: [../v126/index.md](../v126/index.md)."
            echo
            echo "| part | status |"; echo "|---|---|"
            for p in $PARTS; do
              st=$(cat "$p/job-status.txt" 2>/dev/null || echo "no job status")
              if grep -q '## COMPLETE' "$p/summary.txt" 2>/dev/null; then c=COMPLETE; elif [ -f "$p/summary.txt" ]; then c="INCOMPLETE ($(grep -m1 'EMULATOR GONE' "$p/summary.txt" || echo 'stopped early'))"; else c="no summary"; fi
              echo "| $p | $c; $st |"
            done
            echo
            for p in $PARTS; do
              [ -f "$p/summary.txt" ] || { echo "## $p: no summary (job failed?)"; continue; }
              echo "## $p"; echo; echo '```'; cat "$p/summary.txt"; echo '```'; echo
            done
            echo "## Screenshots"
            for d in $(find . -name '*.png' -printf '%h\n' | sort -u); do
              echo; echo "### ${d#./}"; echo
              for f in $(ls "$d"/*.png | sort); do echo "- [${f#./}](${f#./})"; done
            done
            echo; echo "## Other files"; echo
            find . -type f ! -name '*.png' ! -name index.md -print | sort | sed 's|^\./||; s|.*|- [&](&)|'
          } > index.md
          cd "$RUNNER_TEMP/pub"
          if [ -f index.md ] && ! grep -q "v127b/index.md" index.md; then
            { head -1 index.md; echo; echo "v1.2.27 full test (released app, 8dc63c1): [v127b/index.md](v127b/index.md)"; tail -n +2 index.md; } > "$RUNNER_TEMP/idx" && mv "$RUNNER_TEMP/idx" index.md
          fi
          git init -q -b emulator-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator results v127b for $SRC (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/emulator-results
