name: Perf check (temporary)
on:
  push:
    branches: [debug/wave8-scanner-check]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build minified prodRelease APK (throwaway key)
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/t.jks" -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 1 -dname "CN=repro"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/t.jks" SIGNING_STORE_PASSWORD="$PASS" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$PASS"
          mkdir -p out && echo "-printconfiguration $PWD/out/r8-config.txt" >> app/proguard-rules.pro
          ./gradlew --no-daemon assembleProdRelease
          cp "$(ls app/build/outputs/apk/prod/release/*.apk | head -1)" app.apk && ls -l app.apk
      - name: APK / R8 summary
        run: |
          echo "=== largest APK entries"; unzip -lv app.apk | sort -k3 -n -r | head -30
          M=app/build/outputs/mapping/prodRelease/mapping.txt
          echo "=== kept classes by package (top 45)"
          grep -E '^[^ #].* -> .*:$' $M | awk '{print $1}' | awk -F. '{n=NF-1; if(n>4)n=4; s=$1; for(i=2;i<=n;i++)s=s"."$i; print s}' | sort | uniq -c | sort -rn | head -45
          echo "=== zxing classes kept"; grep -E '^com\.google\.zxing\.[^ ]* -> ' $M | awk '{print $1}' | sort | head -150
          echo "=== keep rules (merged config, without -keepattributes)"
          grep -nE '^-keep[a-z,]* ' out/r8-config.txt | grep -v -- '-keepattributes' | cut -c1-200 | head -400
          echo "=== config sources"; grep -nE '^# The proguard configuration file for the following section is ' out/r8-config.txt | cut -c1-220 | head -80
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/perf-check/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-check
          path: out/
