name: Emulator check wave 16 / v1.2.30 (temporary)
# ВРЕМЕННО: проверка на сливането на вълна 16 (origin/claude/charming-rubin-3lzor2 @ bf10741) на
# емулатор преди изданието, със сравнение с v1.2.29 (tag v1.2.29 = b84650f). Настройката е от
# debug/wave15-check. Резултатите (снимки, логове, числа) се публикуват в клона emulator-results,
# папка v130/ (orphan, force-push; останалото съдържание на клона се запазва).
# Стъпките с емулатора са continue-on-error: паднал емулатор се записва в резултатите,
# а изпълнението завършва зелено (без писма за неуспех).
#
# Изданията се строят като в release.yml (assembleProdRelease, versionName на изданието), с
# временен ключ, общ за всички APK-та: v1.2.30 — versionCode 1488543, v1.2.29 — 1488542.
# Първо APK-ът точно като за изданието (без x86_64) — за размера; после с добавено x86_64
# (sed, само тук — не се записва в клона) — за емулатора.
#   app.apk          — тестовото v1.2.30 (както изданието, адресът за обновяване — истинският).
#   app-dev.apk      — devDebug на същия commit (org.chyavorec.app.dev, демо вход) — за грешните ПИН-ове
#                      и временното блокиране без истинския сървър.
#   app-new-upd.apk  — кодът на v1.2.30 с versionCode 1488542 („1.2.30-pre“), update.json → тестовото
#                      v1.2.30: изтеглянето с известие за хода (новият код е в обновяващото се приложение).
#   app-base.apk     — v1.2.29 за A/B; UPDATE_MANIFEST_URL → none.json (същата версия, без обновяване).
#   app-base-upd.apk — v1.2.29, UPDATE_MANIFEST_URL → update.json с тестовото v1.2.30 и истинските
#                      бележки на 1.2.30 (tools/whats_new.py от store/whats-new.md, както в release.yml).
#   helper.apk       — помощно приложение само за емулатора (.github/perf-check/helper).
on:
  push:
    branches: [debug/wave16-check]
permissions:
  contents: read
env:
  NEW_REF: bf107414430986f77a93fa1aa81ccd696a310473
  BASE_REF: b84650fce3bc77adc89d8cb38ed4e6a68a11f4d3
  VC_NEW: "1488543"
  VC_BASE: "1488542"
  # Папката на тестовото обновяване — с номера на изпълнението (кешът на raw.githubusercontent).
  STAGE: v130/update/${{ github.run_id }}
jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Throwaway signing key, shared by all test APKs
        run: |
          mkdir key; PASS=$(openssl rand -hex 16); echo "$PASS" > key/pass
          keytool -genkeypair -noprompt -keystore key/t.jks -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 3 -dname "CN=emulator test, O=not for release"
      - uses: actions/upload-artifact@v7
        with:
          name: key
          path: key/
          retention-days: 1

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the emulator helper APK (intent catcher, test accessibility service, device locale)
        run: |
          mkdir -p dist
          bash .github/perf-check/helper/build.sh dist/helper.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-helper
          path: dist/

  build:
    needs: key
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: new, vname: "1.2.30" }
          - { app: base, vname: "1.2.29" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.app == 'new' && env.NEW_REF || env.BASE_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: key
          path: ${{ runner.temp }}/key
      - name: versionName of the release (as release.yml does; not committed)
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ matrix.vname }}"/' app/build.gradle.kts
          grep -nE '^val releaseAbis|versionName = |useLegacyPackaging' app/build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build minified prodRelease APK exactly like the release (arm only) — for the size
        run: |
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          VC=${{ matrix.app == 'new' && env.VC_NEW || env.VC_BASE }}
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=$VC
          ./gradlew --no-daemon assembleProdRelease
          mkdir -p dist
          A="$RUNNER_TEMP/release-${{ matrix.app }}.apk"
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "$A"
          cp "$A" dist/app-release-arm.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          {
            echo "== ${{ matrix.app }} ${{ matrix.vname }} $(git rev-parse --short HEAD): release-config APK (arm64-v8a + armeabi-v7a, minified, throwaway key)"
            echo "APK size: $(stat -c %s "$A") bytes"
            echo "manifest: $($AAPT dump xmltree --file AndroidManifest.xml "$A" | grep -E 'extractNativeLibs|versionCode|versionName' | tr -s ' ' | tr '\n' ' ')"
            echo "uses-permission: $($AAPT dump permissions "$A" | grep -oE "uses-permission: name='[^']+'" | sed "s/uses-permission: name=//" | tr '\n' ' ')"
            echo "foreground services: $($AAPT dump xmltree --file AndroidManifest.xml "$A" | grep -A3 'SystemForegroundService' | grep -oE 'foregroundServiceType[^ ]*' | tr '\n' ' ')"
            python3 - "$A" <<'EOF'
          import zipfile, sys, collections
          z = zipfile.ZipFile(sys.argv[1])
          comp, unc, cnt = collections.Counter(), collections.Counter(), collections.Counter()
          for i in z.infolist():
              p = i.filename
              if p.startswith('lib/'): k = '/'.join(p.split('/')[:2])
              elif p.endswith('.dex'): k = 'classes*.dex'
              elif p.startswith('res/'): k = 'res'
              elif '/' in p: k = p.split('/')[0] + '/'
              else: k = p
              comp[k] += i.compress_size; unc[k] += i.file_size; cnt[k] += 1
          print(f"{'part':<22}{'compressed':>12}{'uncompressed':>14}{'files':>7}")
          for k, v in comp.most_common():
              print(f"{k:<22}{v:>12}{unc[k]:>14}{cnt[k]:>7}")
          EOF
          } > dist/size-${{ matrix.app }}.txt
          cat dist/size-${{ matrix.app }}.txt
      - name: Temporary x86_64 ABI (emulator only, not committed) and rebuild
        run: |
          sed -i 's|^val releaseAbis = listOf("arm64-v8a", "armeabi-v7a")$|val releaseAbis = listOf("arm64-v8a", "armeabi-v7a", "x86_64") // ВРЕМЕННО|' app/build.gradle.kts
          grep -nE '^val releaseAbis' app/build.gradle.kts
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          VC=${{ matrix.app == 'new' && env.VC_NEW || env.VC_BASE }}
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=$VC
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/emulator-results/$STAGE"
          if [ ${{ matrix.app }} = new ]; then
            ./gradlew --no-daemon assembleProdRelease
            cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/app.apk
            echo "${{ matrix.vname }} $(git rev-parse --short HEAD) ($(git log -1 --format=%s | cut -c1-60)); versionCode $VC; x86_64 libs: $(unzip -l dist/app.apk | grep -c 'lib/x86_64/' || true)" > dist/apk-ref.txt
            # Демо входът (dev): грешни ПИН-ове и блокиране без истинския сървър.
            ./gradlew --no-daemon assembleDevDebug
            cp app/build/outputs/apk/dev/debug/app-dev-debug.apk dist/app-dev.apk
            echo "devDebug ${{ matrix.vname }}-dev $(git rev-parse --short HEAD); org.chyavorec.app.dev; demo reader services" > dist/apk-dev-ref.txt
            # Кодът на v1.2.30 под по-нисък versionCode, обновява се към тестовото v1.2.30.
            sed -i 's/versionName = ".*"/versionName = "1.2.30-pre"/' app/build.gradle.kts
            export VERSION_CODE=${{ env.VC_BASE }} UPDATE_MANIFEST_URL="$RAW/update.json"
            ./gradlew --no-daemon assembleProdRelease
            cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/app-new-upd.apk
            echo "1.2.30-pre $(git rev-parse --short HEAD) (v1.2.30 code); versionCode ${{ env.VC_BASE }}; update manifest $UPDATE_MANIFEST_URL" > dist/apk-new-upd-ref.txt
          else
            export UPDATE_MANIFEST_URL="$RAW/none.json"
            ./gradlew --no-daemon assembleProdRelease
            cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/app-base.apk
            echo "${{ matrix.vname }} $(git rev-parse --short HEAD) ($(git log -1 --format=%s | cut -c1-60)); versionCode $VC; x86_64 libs: $(unzip -l dist/app-base.apk | grep -c 'lib/x86_64/' || true); update manifest: no-update stub" > dist/apk-base-ref.txt
            export UPDATE_MANIFEST_URL="$RAW/update.json"
            ./gradlew --no-daemon assembleProdRelease
            cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/app-base-upd.apk
            echo "${{ matrix.vname }} $(git rev-parse --short HEAD); versionCode $VC; update manifest $UPDATE_MANIFEST_URL" > dist/apk-base-upd-ref.txt
          fi
          rm -f dist/app-release-arm.apk
          cat dist/*.txt; ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app }}
          path: dist/

  # Тестовото v1.2.30 и update.json (бележките на 1.2.30 от store/whats-new.md през
  # tools/whats_new.py, както в release.yml) в emulator-results/v130/update/<run>/.
  stage-update:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.NEW_REF }}
          path: newsrc
      - uses: actions/download-artifact@v8
        with:
          name: apk-new
          path: dist
      - name: Stage update.json + none.json + APK (orphan, force; the rest of the branch is kept)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          WN="$RUNNER_TEMP/whats-new"; mkdir -p "$WN"
          # Както release.yml: издадените версии от GitHub API, после най-горният раздел, ако е за 1.2.30.
          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/released.part"; then
            mv "$RUNNER_TEMP/released.part" "$RUNNER_TEMP/released.txt"
          fi
          head -5 "$RUNNER_TEMP/released.txt" || true
          python3 newsrc/tools/whats_new.py 1.2.30 newsrc/store/whats-new.md "$RUNNER_TEMP/released.txt" "$WN"
          cat "$WN"/notes.bg.txt "$WN"/notes.en.txt
          R="https://github.com/${{ github.repository }}.git"
          mkdir -p "$RUNNER_TEMP/pub"; cd "$RUNNER_TEMP/pub"
          git init -q -b emulator-results
          if git fetch -q --depth 1 "$R" emulator-results; then git archive FETCH_HEAD | tar -x; fi
          mkdir -p "$STAGE"; cp "$GITHUB_WORKSPACE/dist/app.apk" "$STAGE/app.apk"
          cp "$WN/notes.bg.txt" "$STAGE/notes.bg.txt"; cp "$WN/notes.en.txt" "$STAGE/notes.en.txt"
          WN="$WN" python3 - <<'PY'
          import hashlib, json, os
          st = os.environ["STAGE"]; repo = os.environ["GITHUB_REPOSITORY"]; wn = os.environ["WN"]
          notes = lambda lang: open(os.path.join(wn, f"notes.{lang}.txt"), encoding="utf-8").read().strip()
          apk = f"{st}/app.apk"
          raw = f"https://raw.githubusercontent.com/{repo}/emulator-results/{st}"
          data = {
              "versionCode": int(os.environ["VC_NEW"]), "versionName": "1.2.30",
              "apkUrl": f"{raw}/app.apk",
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk), "minSdk": 26,
              "notes": notes("bg"), "notes_en": notes("en"),
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v1.2.30",
          }
          json.dump(data, open(f"{st}/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          none = dict(data, versionCode=int(os.environ["VC_BASE"]), versionName="1.2.29", notes="", notes_en="")
          json.dump(none, open(f"{st}/none.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Stage the v1.2.30 test update for the v130 emulator run (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/emulator-results

  emulator:
    needs: [build, helper, stage-update]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # API 33 със swangle_indirect; частите с „34“ — API 34, с „26“/„28“ — API 26/28 (също swangle_indirect).
        # Вълна 16: unlock33/34, login, update, events, dialogs, widgetlang, a11y16, tablet, onboard,
        # emoji26/28. Регресия: abstart-1/2, mem, mem-base, monkey, rot, offline, look1/2/3, a11y.
        # Кръг 1 (run 41338157812): всички части. Кръг 2: отказът на проверката с „Назад“, Esc в полето,
        # повторното изтегляне, TalkBack, таблетът (книгата от каталога), езикът на устройството, емоджи.
        part: [unlock33, unlock34, login, update, a11y16, tablet, onboard, widgetlang, emoji26, emoji28, emoji33]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l *.apk; cat apk-*.txt
          python3 -c "import PIL, numpy" 2>/dev/null && command -v ffmpeg || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq python3-pil python3-numpy ffmpeg >/dev/null 2>&1; }
          python3 -c "import PIL; print('PIL', PIL.__version__)" || true
      - name: Run on emulator (${{ matrix.part }}, swangle_indirect)
        id: run
        continue-on-error: true
        timeout-minutes: 66
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/emulator-results/${{ env.STAGE }}
        with:
          api-level: ${{ contains(matrix.part, '34') && 34 || contains(matrix.part, '28') && 28 || contains(matrix.part, '26') && 26 || 33 }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Без камера (емулаторът пада при отваряне на камерата).
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/perf-check/run.sh ${{ matrix.part }}
      - name: Record the step outcome
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/${{ matrix.part }}
          echo "part=${{ matrix.part }} target=google_apis api=${{ contains(matrix.part, '34') && 34 || contains(matrix.part, '28') && 28 || contains(matrix.part, '26') && 26 || 33 }} gpu=swangle_indirect emulator-step=${{ steps.run.outcome }}" > out/${{ matrix.part }}/job-status.txt
          cat out/${{ matrix.part }}/job-status.txt
          { echo "== free"; free -m; echo "== host kernel: oom / kvm / segfault"; sudo dmesg -T | grep -iE "oom|killed process|kvm|segfault|qemu|trap" | tail -40
            echo "== emulator processes"; ps -eo pid,etime,rss,stat,args | grep -iE "qemu|emulator" | grep -v grep | cut -c1-200
            echo "== emulator crash dumps / logs"; find /tmp ~/.android -newer app.apk \( -name '*.dmp' -o -name '*crash*' \) 2>/dev/null | head -20; } > out/${{ matrix.part }}/host-after-run.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: out-${{ matrix.part }}
          path: out/

  publish:
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: out-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true
      - name: Push results to emulator-results/v130 (orphan, force; the rest of the branch is kept)
        continue-on-error: true
        run: |
          set -e
          SRC=$(git rev-parse --short HEAD)
          mkdir -p "$RUNNER_TEMP/pub" results
          if git fetch -q --depth 1 origin emulator-results; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/pub"; fi
          V="$RUNNER_TEMP/pub/v130"
          mkdir -p "$V"
          # Заменят се само частите от това изпълнение; update.json остават за справка, APK-тата — не.
          for p in $(ls results); do rm -rf "$V/$p"; done
          find "$V/update" -name app.apk -delete 2>/dev/null || true
          cp -r results/. "$V/"
          mkdir -p "$V/size"; cp apks/size-*.txt apks/apk-*ref.txt "$V/size/" 2>/dev/null || true
          echo "run ${{ github.run_id }} (attempt ${{ github.run_attempt }}) @ $SRC: $(ls results | tr '\n' ' ')" >> "$V/runs.txt"
          cd "$V"
          PARTS=$(ls -d */ 2>/dev/null | tr -d / | grep -vE '^(size|update)$' || true)
          {
            echo "# Wave 16 emulator check (bf10741, test v1.2.30, vs v1.2.29 = b84650f)"
            echo
            echo "Source: \`debug/wave16-check\` @ $SRC, last run ${{ github.run_id }} (attempt ${{ github.run_attempt }}), $(date -u +%FT%TZ). Runs: [runs.txt](runs.txt)."
            echo "Emulators: google_apis x86_64 API 33 (parts ending in 34/28/26: that API), pixel_6 profile, -gpu swangle_indirect, no camera; app locale bg-BG unless a part says otherwise. APKs: minified prodRelease, x86_64 added, throwaway key; v1.2.30 versionCode $VC_NEW, v1.2.29 versionCode $VC_BASE."
            echo "Earlier: v1.2.29 check [../v129/index.md](../v129/index.md)."
            echo
            echo "## APK size (release configuration: arm64-v8a + armeabi-v7a, no x86_64)"
            echo; echo '```'; cat size/size-new.txt size/size-base.txt 2>/dev/null; echo '```'; echo
            echo "| part | status |"; echo "|---|---|"
            for p in $PARTS; do
              st=$(cat "$p/job-status.txt" 2>/dev/null || echo "no job status")
              if grep -q '## COMPLETE' "$p/summary.txt" 2>/dev/null; then c=COMPLETE; elif [ -f "$p/summary.txt" ]; then c="INCOMPLETE ($(grep -m1 'EMULATOR GONE' "$p/summary.txt" || echo 'stopped early'))"; else c="no summary"; fi
              echo "| $p | $c; $st |"
            done
            echo
            for p in $PARTS; do
              [ -f "$p/summary.txt" ] || { echo "## $p: no summary (job failed?)"; continue; }
              echo "## $p"; echo; echo '```'; cat "$p/summary.txt"; echo '```'; echo
            done
            echo "## Screenshots"
            for d in $(find . -name '*.png' -printf '%h\n' | sort -u); do
              echo; echo "### ${d#./}"; echo
              for f in $(ls "$d"/*.png | sort); do echo "- [${f#./}](${f#./})"; done
            done
            echo; echo "## Other files"; echo
            find . -type f ! -name '*.png' ! -name index.md -print | sort | sed 's|^\./||; s|.*|- [&](&)|'
          } > index.md
          R="$RUNNER_TEMP/pub/index.md"
          if [ -f "$R" ] && ! grep -q "v130/index.md" "$R"; then
            { head -1 "$R"; echo; echo "Wave 16 check (bf10741, test v1.2.30 vs v1.2.29): [v130/index.md](v130/index.md)"; tail -n +2 "$R"; } > "$RUNNER_TEMP/idx" && mv "$RUNNER_TEMP/idx" "$R"
          fi
          cd "$RUNNER_TEMP/pub"
          git init -q -b emulator-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator results v130 for $SRC (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/emulator-results
