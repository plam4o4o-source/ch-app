name: Full emulator test of the released v1.2.35 (temporary)
# ВРЕМЕННО (клон debug/a6-full): пълна проверка на издаденото v1.2.35 (tag v1.2.35 = aef8910, versionCode
# 1507364) на емулатор, със сравнение с v1.2.34 (tag v1.2.34 = 3812d8e, 1504705), където частта го иска.
# Резултатите — в клона emulator-results, папка v135full/ (нов commit върху върха; без force).
# Инструментите са от debug/w21-shader и debug/wave20-final; новите части са в .github/perf-check/a6.sh.
#   app.apk          — prodRelease (minified) x86_64 от NEW_REF, 1.2.35 / 1507364, временен ключ (x86_64 — само тук, с sed)
#   app-base.apk     — prodRelease x86_64 от BASE_REF (1.2.34 / 1504705), същият ключ; без update.json (адрес, който го няма)
#   app-base-upd.apk — същото 1.2.34, но с update.json от emulator-results → app.apk (обновяването през приложението)
#   app-dev.apk      — devDebug от NEW_REF (org.chyavorec.app.dev, демо вход)
on:
  push:
    branches: [debug/a6-full]
    paths: [.github/workflows/perf-check.yml, .github/perf-check/**]
  workflow_dispatch:
permissions:
  contents: read
env:
  NEW_REF: aef891032b0c83ce5d06a8a01b9ea4c1f41889d7
  BASE_REF: 3812d8e8d3fa3c14da02f1dcbe844926ec8b0d15
  VC_NEW: "1507364"
  VC_BASE: "1504705"
  V: v135full
  STAGE: v135full/update/${{ github.run_id }}
jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Throwaway signing key, shared by all built test APKs
        run: |
          mkdir key; PASS=$(openssl rand -hex 16); echo "$PASS" > key/pass
          keytool -genkeypair -noprompt -keystore key/t.jks -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 3 -dname "CN=emulator test, O=not for release"
      - uses: actions/upload-artifact@v7
        with:
          name: key
          path: key/
          retention-days: 1

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the emulator helper APK (intent/share catcher, test accessibility service, device locale)
        run: |
          mkdir -p dist
          bash .github/perf-check/helper/build.sh dist/helper.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-helper
          path: dist/

  build:
    needs: key
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: new, vname: "1.2.35", vc: "1507364" }
          - { app: base, vname: "1.2.34", vc: "1504705" }
          - { app: baseupd, vname: "1.2.34", vc: "1504705" }
          - { app: dev, vname: "1.2.35", vc: "1" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (matrix.app == 'base' || matrix.app == 'baseupd') && env.BASE_REF || env.NEW_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: key
          path: ${{ runner.temp }}/key
      - name: versionName of the release (as release.yml does; not committed)
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ matrix.vname }}"/' app/build.gradle.kts
          grep -nE '^val releaseAbis|versionName = ' app/build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: prodRelease with x86_64 added (emulator only, not committed)
        if: matrix.app != 'dev'
        run: |
          sed -i 's|^val releaseAbis = listOf("arm64-v8a", "armeabi-v7a")$|val releaseAbis = listOf("arm64-v8a", "armeabi-v7a", "x86_64") // ВРЕМЕННО|' app/build.gradle.kts
          grep -nE '^val releaseAbis' app/build.gradle.kts
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=${{ matrix.vc }}
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/emulator-results"
          case ${{ matrix.app }} in
            base) export UPDATE_MANIFEST_URL="$RAW/$V/no-update.json";;
            baseupd) export UPDATE_MANIFEST_URL="$RAW/$STAGE/update.json";;
          esac
          ./gradlew --no-daemon assembleProdRelease
          mkdir -p dist
          case ${{ matrix.app }} in new) O=app.apk; R=apk-ref.txt;; base) O=app-base.apk; R=apk-base-ref.txt;; baseupd) O=app-base-upd.apk; R=apk-base-upd-ref.txt;; esac
          cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/$O
          echo "${{ matrix.vname }} $(git rev-parse --short HEAD) built prodRelease (minified), x86_64 added (throwaway key); versionCode ${{ matrix.vc }}; update manifest: ${UPDATE_MANIFEST_URL:-the real one (releases/latest)}" > dist/$R
          cat dist/*.txt; ls -l dist
      - name: devDebug (demo data)
        if: matrix.app == 'dev'
        run: |
          ./gradlew --no-daemon assembleDevDebug
          mkdir -p dist
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk dist/app-dev.apk
          echo "devDebug ${{ matrix.vname }} $(git rev-parse --short HEAD) (org.chyavorec.app.dev, demo sign-in DEMO-0001)" > dist/apk-dev-ref.txt
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app }}
          path: dist/

  # Построеното v1.2.35 и update.json в emulator-results/v135full/update/<run>/ (за app-base-upd.apk).
  stage-update:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.NEW_REF }}
          path: newsrc
      - uses: actions/download-artifact@v8
        with:
          name: apk-new
          path: dist
      - name: Stage update.json + APK (a new commit on top of emulator-results; no force)
        continue-on-error: true
        run: |
          set -e
          WN="$RUNNER_TEMP/whats-new"; mkdir -p "$WN"
          python3 newsrc/tools/whats_new.py --section 1.2.35 newsrc/store/whats-new.md "$WN" || { echo "• Тест" > "$WN/notes.bg.txt"; echo "• Test" > "$WN/notes.en.txt"; }
          cat "$WN"/notes.bg.txt
          P="$RUNNER_TEMP/pub"; mkdir -p "$P"; cd "$P"
          git init -q -b scratch
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch -q --filter=blob:none --depth 1 origin emulator-results
            TIP=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            mkdir -p "$STAGE"; cp "$GITHUB_WORKSPACE/dist/app.apk" "$STAGE/app.apk"
            WN="$WN" python3 - <<'PY'
          import hashlib, json, os
          st = os.environ["STAGE"]; repo = os.environ["GITHUB_REPOSITORY"]; wn = os.environ["WN"]
          notes = lambda lang: open(os.path.join(wn, f"notes.{lang}.txt"), encoding="utf-8").read().strip()
          apk = f"{st}/app.apk"
          raw = f"https://raw.githubusercontent.com/{repo}/emulator-results/{st}"
          data = {
              "versionCode": int(os.environ["VC_NEW"]), "versionName": "1.2.35",
              "apkUrl": f"{raw}/app.apk",
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk), "minSdk": 26,
              "notes": notes("bg"), "notes_en": notes("en"),
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v1.2.35",
          }
          json.dump(data, open(f"{st}/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
            git add "$STAGE"
            C=$(git commit-tree "$(git write-tree)" -p "$TIP" -m "Stage the built v1.2.35 update for the v135full emulator run (run ${{ github.run_id }})")
            git push origin "$C:refs/heads/emulator-results" && break
            echo "emulator-results moved during the stage; retrying"; sleep $((try * 7))
          done

  emulator:
    needs: [build, helper, stage-update]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 135
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # API 33 google_apis x86_64, -gpu swangle_indirect; hi28, c28 — API 28; c26 — API 26; c36 — API 36.
        part: [tour-a, tour-b, tour-c, robust, offline, a6new, year35, idle33, hi28, gfx35, mem, monkey, upd35, a11yt, c26, c28, c36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l *.apk; cat apk-*.txt
          python3 -c "import PIL, numpy, cv2" 2>/dev/null && command -v ffmpeg || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq python3-pil python3-numpy python3-opencv ffmpeg >/dev/null 2>&1; }
          python3 -c "import PIL; print('PIL', PIL.__version__)"; command -v ffmpeg
      - name: Run on emulator (${{ matrix.part }}, swangle_indirect)
        id: run
        continue-on-error: true
        timeout-minutes: 120
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/emulator-results/${{ env.STAGE }}
        with:
          api-level: ${{ matrix.part == 'c26' && '26' || contains(matrix.part, '28') && '28' || matrix.part == 'c36' && '36' || '33' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/perf-check/run.sh ${{ matrix.part }}
      - name: Record the step outcome, shrink the output
        if: always()
        continue-on-error: true
        run: |
          O=out/${{ matrix.part }}; mkdir -p $O
          echo "part=${{ matrix.part }} target=google_apis api=${{ matrix.part == 'c26' && '26' || contains(matrix.part, '28') && '28' || matrix.part == 'c36' && '36' || '33' }} gpu=swangle_indirect emulator-step=${{ steps.run.outcome }}" > $O/job-status.txt
          cat $O/job-status.txt
          rm -rf $O/rec $O/yr
          { echo "== free"; free -m; echo "== host kernel: oom / kvm / segfault"; sudo dmesg -T | grep -iE "oom|killed process|segfault" | tail -20; } > $O/host-after-run.txt 2>&1 || true
          [ -f $O/logcat-all.txt ] || cat $O/logcat-live.txt $O/logcat-dump.txt 2>/dev/null | awk '!seen[$0]++' > $O/logcat-all.txt
          python3 .github/perf-check/a6.py crashes $O/logcat-all.txt $O/crashes.txt | tee -a $O/summary.txt || true
          python3 .github/perf-check/a6post.py $O || true
          du -sh $O; find $O -type f | wc -l
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: out-${{ matrix.part }}
          path: out/

  # Клонът emulator-results е голям: fetch без съдържанието на файловете (blob:none), индексът — от върха му;
  # заменят се само папките на това изпълнение; нов commit ВЪРХУ върха (родител — прочетеният връх), push без
  # force; ако клонът се е преместил — отново от новия връх.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    needs: [build, emulator]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: out-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true
      - name: Push results to emulator-results/v135full (a new commit on top; the rest of the branch is kept)
        run: |
          set -ex
          SRC=$(git rev-parse --short HEAD)
          W=$GITHUB_WORKSPACE
          RUN=${{ github.run_id }}
          ls results | head -60; du -sh results || true
          P="$RUNNER_TEMP/pub"; mkdir -p "$P"; cd "$P"
          git init -q -b scratch
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch --filter=blob:none --depth 1 origin emulator-results
            TIP=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            rm -rf "$V"
            for p in $(ls "$W/results"); do git rm -r -q --cached --ignore-unmatch "$V/$p"; done
            mkdir -p "$V"; cp -r "$W/results/." "$V/"
            mkdir -p "$V/size"; cp "$W"/apks/apk-*ref.txt "$V/size/" 2>/dev/null || true
            for a in app.apk app-base.apk app-base-upd.apk app-dev.apk; do [ -f "$W/apks/$a" ] && echo "$a $(stat -c %s "$W/apks/$a") bytes"; done > "$V/size/apk-size.txt" || true
            git show FETCH_HEAD:$V/runs.txt > "$V/runs.txt" 2>/dev/null || : > "$V/runs.txt"
            echo "run $RUN @ $SRC (new ${NEW_REF:0:7}, base ${BASE_REF:0:7}): $(ls "$W/results" | tr '\n' ' ')" >> "$V/runs.txt"
            # Частите от по-ранни изпълнения: summary.txt и job-status.txt обратно на диска — за индекса (не се добавят наново).
            for p in $(git ls-tree --name-only "FETCH_HEAD:$V" 2>/dev/null); do
              [ -d "$W/results/$p" ] && continue
              git cat-file -e "FETCH_HEAD:$V/$p/summary.txt" 2>/dev/null || continue
              mkdir -p "$V/$p"; git show "FETCH_HEAD:$V/$p/summary.txt" > "$V/$p/summary.txt" || true
              git show "FETCH_HEAD:$V/$p/job-status.txt" > "$V/$p/job-status.txt" 2>/dev/null || true
            done
            (
              cd "$V"
              echo "# Full emulator test of the released v1.2.35 (${NEW_REF:0:7}, versionCode $VC_NEW); v1.2.34 (${BASE_REF:0:7}, $VC_BASE) where a part compares"
              echo
              echo "debug/a6-full (runs in runs.txt, latest $RUN @ $SRC). API 33 google_apis x86_64, -gpu swangle_indirect (software GPU) unless the part says otherwise (hi28, c28: API 28; c26: API 26; c36: API 36). Built prodRelease (minified) x86_64 with a throwaway key; year35: devDebug. Screenshots are JPEG, scaled down (sheets/ = contact sheets). Earlier: [../v135/index.md](../v135/index.md), [../v134/index.md](../v134/index.md)."
              echo; echo "| part | status |"; echo "|---|---|"
              for p in $(ls -d */ | tr -d /); do [ -f "$p/job-status.txt" ] && echo "| $p | $(grep -c '## COMPLETE' $p/summary.txt 2>/dev/null | sed 's/^1$/COMPLETE/;s/^0$/incomplete/'); $(cat $p/job-status.txt) |"; done
              echo; echo '```'; cat size/apk-*ref.txt size/apk-size.txt 2>/dev/null; echo '```'
              echo
              for p in $(ls -d */ | tr -d /); do
                [ -f "$p/summary.txt" ] || continue
                echo "## $p"; echo; echo '```'; cut -c1-1500 "$p/summary.txt"; echo '```'; echo
              done
            ) > "$RUNNER_TEMP/v-index.md"
            mv "$RUNNER_TEMP/v-index.md" "$V/index.md"
            git show FETCH_HEAD:index.md > index.md
            grep -q "$V/index.md" index.md || { { head -1 index.md; echo; echo "Full test of the released v1.2.35 (aef8910): [$V/index.md]($V/index.md)"; tail -n +2 index.md; } > "$RUNNER_TEMP/idx" && mv "$RUNNER_TEMP/idx" index.md; }
            for p in $(ls "$W/results"); do git add -A -- "$V/$p"; done
            git add -A -- "$V/size" "$V/runs.txt" "$V/index.md" index.md
            C=$(git commit-tree "$(git write-tree)" -p "$TIP" -m "Emulator results $V for $SRC (run $RUN)") || { echo "write-tree/commit failed (promisor fetch?); retrying"; sleep $((try * 7)); continue; }
            git push origin "$C:refs/heads/emulator-results" && break
            echo "emulator-results moved; retrying on the new tip"; sleep $((try * 7))
          done
