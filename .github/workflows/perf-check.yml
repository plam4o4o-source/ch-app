name: Emulator check of the v1.2.35 shaders (temporary)
# ВРЕМЕННО (клон debug/w21-shader): шейдърите на шевицата и фолиото в тестовото v1.2.35 (9295534 от
# claude/charming-rubin-3lzor2, промяната — e602e63; versionCode 1504706) срещу издаденото v1.2.34
# (tag v1.2.34 = 3812d8e, 1504705). Резултатите — в клона emulator-results, папка v135/ (orphan commit;
# останалото съдържание на клона се запазва). Инструментите са от debug/wave20-final и debug/wave20-card;
# частите са в .github/perf-check/w21.sh.
#   app.apk      — prodRelease (minified) x86_64 от NEW_REF, 1.2.35 / 1504706, временен ключ (x86_64 — само тук, с sed)
#   app-base.apk — prodRelease x86_64 от BASE_REF (1.2.34 / 1504705), същият ключ
on:
  push:
    branches: [debug/w21-shader]
    paths: [.github/workflows/perf-check.yml, .github/perf-check/**]
  workflow_dispatch:
permissions:
  contents: read
env:
  NEW_REF: 92955343d0f27f390bc5de33e20d914ea8a84d3c
  BASE_REF: 3812d8e8d3fa3c14da02f1dcbe844926ec8b0d15
  V: v135
jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Throwaway signing key, shared by all built test APKs
        run: |
          mkdir key; PASS=$(openssl rand -hex 16); echo "$PASS" > key/pass
          keytool -genkeypair -noprompt -keystore key/t.jks -storepass "$PASS" -keypass "$PASS" \
            -alias t -keyalg RSA -keysize 2048 -validity 3 -dname "CN=emulator test, O=not for release"
      - uses: actions/upload-artifact@v7
        with:
          name: key
          path: key/
          retention-days: 1

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the emulator helper APK (device locale on API 28)
        run: |
          mkdir -p dist
          bash .github/perf-check/helper/build.sh dist/helper.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-helper
          path: dist/

  build:
    needs: key
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: new, vname: "1.2.35", vc: "1504706" }
          - { app: base, vname: "1.2.34", vc: "1504705" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.app == 'base' && env.BASE_REF || env.NEW_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: key
          path: ${{ runner.temp }}/key
      - name: versionName of the release (as release.yml does; not committed)
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ matrix.vname }}"/' app/build.gradle.kts
          grep -nE '^val releaseAbis|versionName = ' app/build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: prodRelease with x86_64 added (emulator only, not committed)
        run: |
          sed -i 's|^val releaseAbis = listOf("arm64-v8a", "armeabi-v7a")$|val releaseAbis = listOf("arm64-v8a", "armeabi-v7a", "x86_64") // ВРЕМЕННО|' app/build.gradle.kts
          grep -nE '^val releaseAbis' app/build.gradle.kts
          K="$RUNNER_TEMP/key"; P=$(cat "$K/pass")
          export SIGNING_STORE_FILE="$K/t.jks" SIGNING_STORE_PASSWORD="$P" SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD="$P" VERSION_CODE=${{ matrix.vc }}
          ./gradlew --no-daemon assembleProdRelease
          mkdir -p dist
          case ${{ matrix.app }} in new) O=app.apk; R=apk-ref.txt;; base) O=app-base.apk; R=apk-base-ref.txt;; esac
          cp app/build/outputs/apk/prod/release/app-prod-release.apk dist/$O
          echo "${{ matrix.vname }} $(git rev-parse --short HEAD) built prodRelease (minified), x86_64 added (throwaway key); versionCode ${{ matrix.vc }}" > dist/$R
          cat dist/*.txt; ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app }}
          path: dist/

  emulator:
    needs: [build, helper]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # start35, card35, reg35, now35 — API 33 google_apis x86_64; old28s, full28 — API 28. Всички с -gpu swangle_indirect.
        # Кръг 1 (43258710930): start35, card35, reg35, old28s.
        part: [now35, full28]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l *.apk; cat apk-*.txt
          python3 -c "import PIL, numpy" 2>/dev/null || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq python3-pil python3-numpy >/dev/null 2>&1; }
          python3 -c "import PIL; print('PIL', PIL.__version__)"
      - name: Run on emulator (${{ matrix.part }}, swangle_indirect)
        id: run
        continue-on-error: true
        timeout-minutes: 105
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ contains(matrix.part, '28') && '28' || '33' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/perf-check/run.sh ${{ matrix.part }}
      - name: Record the step outcome
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/${{ matrix.part }}
          echo "part=${{ matrix.part }} target=google_apis api=${{ contains(matrix.part, '28') && '28' || '33' }} gpu=swangle_indirect emulator-step=${{ steps.run.outcome }}" > out/${{ matrix.part }}/job-status.txt
          cat out/${{ matrix.part }}/job-status.txt
          rm -rf out/${{ matrix.part }}/rec/*/
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: out-${{ matrix.part }}
          path: out/

  # Клонът emulator-results е голям: fetch без съдържанието на файловете (blob:none), индексът — от върха му;
  # заменят се само папките на това изпълнение; нов orphan commit, push само с новите обекти
  # (--force-with-lease на прочетения връх).
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    needs: [build, emulator]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: out-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true
      - name: Push results to emulator-results/v135 (orphan commit; the rest of the branch is kept)
        run: |
          set -ex
          SRC=$(git rev-parse --short HEAD)
          W=$GITHUB_WORKSPACE
          RUN=${{ github.run_id }}
          ls -R results | head -60
          P="$RUNNER_TEMP/pub"; mkdir -p "$P"; cd "$P"
          git init -q -b scratch
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch --filter=blob:none --depth 1 origin emulator-results
            TIP=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            rm -rf "$V"
            for p in $(ls "$W/results"); do git rm -r -q --cached --ignore-unmatch "$V/$p"; done
            mkdir -p "$V"; cp -r "$W/results/." "$V/"
            mkdir -p "$V/size"; cp "$W"/apks/apk-*ref.txt "$V/size/" 2>/dev/null || true
            for a in app.apk app-base.apk; do [ -f "$W/apks/$a" ] && echo "$a $(stat -c %s "$W/apks/$a") bytes"; done > "$V/size/apk-size.txt" || true
            git show FETCH_HEAD:$V/runs.txt > "$V/runs.txt" 2>/dev/null || : > "$V/runs.txt"
            echo "run $RUN @ $SRC (new ${NEW_REF:0:7}, base ${BASE_REF:0:7}): $(ls "$W/results" | tr '\n' ' ')" >> "$V/runs.txt"
            # Частите от по-ранни изпълнения: summary.txt и job-status.txt обратно на диска — за индекса (не се добавят наново).
            for p in $(git ls-tree --name-only "FETCH_HEAD:$V" 2>/dev/null); do
              [ -d "$W/results/$p" ] && continue
              git cat-file -e "FETCH_HEAD:$V/$p/summary.txt" 2>/dev/null || continue
              mkdir -p "$V/$p"; git show "FETCH_HEAD:$V/$p/summary.txt" > "$V/$p/summary.txt" || true
              git show "FETCH_HEAD:$V/$p/job-status.txt" > "$V/$p/job-status.txt" 2>/dev/null || true
            done
            (
              cd "$V"
              echo "# Emulator check of the v1.2.35 shaders (${NEW_REF:0:7}, versionCode 1504706) vs the released v1.2.34 (${BASE_REF:0:7}, 1504705)"
              echo
              echo "debug/w21-shader (runs in runs.txt, latest $RUN @ $SRC). API 33 google_apis x86_64, -gpu swangle_indirect (software GPU); old28s: API 28. Earlier: [../v134/index.md](../v134/index.md), [../v134-card/index.md](../v134-card/index.md)."
              echo; echo "| part | status |"; echo "|---|---|"
              for p in $(ls -d */ | tr -d /); do [ -f "$p/job-status.txt" ] && echo "| $p | $(grep -c '## COMPLETE' $p/summary.txt 2>/dev/null | sed 's/^1$/COMPLETE/;s/^0$/incomplete/'); $(cat $p/job-status.txt) |"; done
              echo; echo '```'; cat size/apk-*ref.txt size/apk-size.txt 2>/dev/null; echo '```'
              echo
              for p in $(ls -d */ | tr -d /); do
                [ -f "$p/summary.txt" ] || continue
                echo "## $p"; echo; echo '```'; cat "$p/summary.txt"; echo '```'; echo
              done
              echo "## Files"; echo
              { find . -type f ! -name index.md -print | sed 's|^\./||'; git -C .. ls-tree -r --name-only FETCH_HEAD -- "$V" | sed "s|^$V/||"; } | grep -v '^index.md$' | sort -u | sed 's|.*|- [&](&)|'
            ) > "$RUNNER_TEMP/v-index.md"
            mv "$RUNNER_TEMP/v-index.md" "$V/index.md"
            git show FETCH_HEAD:index.md > index.md
            grep -q "$V/index.md" index.md || { { head -1 index.md; echo; echo "v1.2.35 shaders (9295534 vs v1.2.34): [$V/index.md]($V/index.md)"; tail -n +2 index.md; } > "$RUNNER_TEMP/idx" && mv "$RUNNER_TEMP/idx" index.md; }
            for p in $(ls "$W/results"); do git add -A -- "$V/$p"; done
            git add -A -- "$V/size" "$V/runs.txt" "$V/index.md" index.md
            C=$(git commit-tree "$(git write-tree)" -m "Emulator results $V for $SRC (run $RUN)") || { echo "write-tree/commit failed (promisor fetch?); retrying"; sleep $((try * 7)); continue; }
            git push --force-with-lease=refs/heads/emulator-results:$TIP origin "$C:refs/heads/emulator-results" && break
            echo "emulator-results moved; retrying on the new tip"; sleep $((try * 7))
          done
