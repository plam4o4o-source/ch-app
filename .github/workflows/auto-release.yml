name: Auto release

# Автоматично издание (GitHub Release: APK + AAB + update.json), когато в main
# влезе промяна по приложението и CI е зелен — след сливане на Dependabot PR
# (dependabot-automerge.yml) или след push в main. Версия: +1 на последната
# (patch), напр. v1.1.0 → v1.1.1. Инсталираните APK-та се обновяват сами.
on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
      - id: plan
        run: |
          git fetch --tags --force --quiet
          REF=$(git rev-parse HEAD)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then LAST=v1.0.0; fi
          # Само промени по приложението водят до ново издание (не документация/CI).
          if git rev-parse -q --verify "refs/tags/$LAST" >/dev/null && \
             git diff --quiet "$LAST" "$REF" -- app shared gradle build.gradle.kts settings.gradle.kts gradle.properties; then
            echo "Няма промени по приложението след $LAST — без издание."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r MA MI PA <<< "${LAST#v}"
          V="$MA.$MI.$((PA + 1))"
          echo "Ново издание: v$V (след $LAST)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            git log --no-merges --format='• %s' "$LAST..$REF" 2>/dev/null | grep -v '^• ci' | head -15
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.ref }}
      notes: ${{ needs.plan.outputs.notes }}
    secrets: inherit
