name: Update control

# Аварийно спиране / пускане на самообновяването на APK-тата извън Google Play.
# Сваля update.json от изданието, слага (pause) или маха (resume) "paused": true и
# го качва обратно (gh release upload --clobber). „notes“ — „Какво ново“ на вече публикувано
# издание наново от store/whats-new.md (разделът с точно тази версия): notes/notes_en в
# update.json и в описанието на изданието; APK-ът и контролните суми не се пипат. Приложението чете
# /releases/latest/download/update.json и при "paused": true не предлага и не
# тегли версията. С dry_run само показва резултата. Подробно: docs/RELEASE.md.
# Пуска се от main (Run workflow → Use workflow from: main); от друг клон спира с грешка.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause = спри обновяванията, resume = пусни ги отново, notes = „Какво ново“ от store/whats-new.md"
        type: choice
        options: [pause, resume, notes]
        required: true
      tag:
        description: "Издание (напр. v1.2.7); latest = последното публикувано (него чете приложението)"
        required: false
        default: latest
      reason:
        description: "Защо (само за хората; записва се като pausedReason, приложението не го чете)"
        required: false
        default: ""
      dry_run:
        description: "Само покажи новия update.json, без да го качваш"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-control
  cancel-in-progress: false

jobs:
  update-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTION: ${{ inputs.action }}
      TAG_INPUT: ${{ inputs.tag }}
      REASON: ${{ inputs.reason }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # Само от main: изданията и update.json се управляват оттам. „Run workflow“ предлага
      # клона по подразбиране — от друг клон спира с ясна грешка (не се пропуска тихо).
      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Update control се пуска само от клона main: Run workflow → Use workflow from: main (сега: ${GITHUB_REF_NAME}). Нищо не е променено."
          exit 1

      - name: Resolve release
        run: |
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          TAG="${TAG_INPUT:-latest}"
          if [ "$TAG" = "latest" ]; then TAG="$LATEST"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Невалиден tag: $TAG (очаква се vX.Y.Z или latest)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Издание: $TAG (последното публикувано: $LATEST)"
          if [ "$TAG" != "$LATEST" ]; then
            echo "::warning::$TAG не е последното публикувано издание ($LATEST) — приложението чете само update.json на $LATEST."
          fi

      # „Какво ново“ — от store/whats-new.md на main (разделът с точно тази версия).
      - uses: actions/checkout@v7
        if: inputs.action == 'notes'
        with:
          path: src

      - name: What's new from store/whats-new.md
        if: inputs.action == 'notes'
        run: |
          # Без списък с изданията: разделът се ползва само при точно съвпадение на версията.
          mkdir -p notes
          python3 src/tools/whats_new.py "${TAG#v}" src/store/whats-new.md /nonexistent notes
          if grep -qx "Подобрения и поправки." notes/notes.bg.txt; then
            echo "::error::В store/whats-new.md няма раздел „## ${TAG#v}“ — нищо не е променено."
            exit 1
          fi
          echo "NOTES_DIR=$PWD/notes" >> "$GITHUB_ENV"

      - name: Download update.json
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$REPO" --pattern update.json --dir work --clobber
          echo "Сега:"
          cat work/update.json; echo

      - name: Edit update.json
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path = "work/update.json"
          data = json.load(open(path, encoding="utf-8"))
          if not isinstance(data, dict) or "versionCode" not in data or "apkUrl" not in data:
              raise SystemExit("update.json не прилича на манифест на обновяване")
          action = os.environ["ACTION"]
          if action == "pause":
              data["paused"] = True
              data["pausedAt"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              reason = os.environ.get("REASON", "").strip()
              if reason:
                  data["pausedReason"] = reason
              else:
                  data.pop("pausedReason", None)
          elif action == "resume":
              for key in ("paused", "pausedAt", "pausedReason"):
                  data.pop(key, None)
          elif action == "notes":
              d = os.environ["NOTES_DIR"]
              data["notes"] = open(os.path.join(d, "notes.bg.txt"), encoding="utf-8").read().strip()
              data["notes_en"] = open(os.path.join(d, "notes.en.txt"), encoding="utf-8").read().strip()
          else:
              raise SystemExit(f"Непознато действие: {action}")
          json.dump(data, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          echo "Ново ($ACTION):"
          cat work/update.json; echo

      - name: Upload update.json
        if: inputs.dry_run != true
        run: |
          gh release upload "$TAG" work/update.json --repo "$REPO" --clobber
          echo "::notice::update.json на $TAG е обновен ($ACTION). Приложенията го виждат при следващата проверка (до ~12 ч. при отваряне, ~24 ч. във фона; ръчната проверка — веднага)."

      # Описанието на изданието: блоковете „Какво ново:“ и „What's new:“ (както ги пише release.yml).
      - name: Release notes
        if: inputs.action == 'notes' && inputs.dry_run != true
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > body.md
          python3 - <<'PY'
          import os, re
          d = os.environ["NOTES_DIR"]
          bg = open(os.path.join(d, "notes.bg.txt"), encoding="utf-8").read().strip()
          en = open(os.path.join(d, "notes.en.txt"), encoding="utf-8").read().strip()
          body = open("body.md", encoding="utf-8").read()
          new, n = re.subn(r"(Какво ново:\n).*?(\n\nWhat's new:\n).*?(\n\n)", lambda m: m.group(1) + bg + m.group(2) + en + m.group(3), body, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Описанието на изданието няма блоковете „Какво ново“/„What's new“")
          open("body.md", "w", encoding="utf-8").write(new)
          PY
          gh release edit "$TAG" --repo "$REPO" --notes-file body.md

      - name: Dry run
        if: inputs.dry_run == true
        run: echo "::notice::Dry run — нищо не е качено. Пуснете отново без dry_run, за да приложите ($ACTION на $TAG)."
