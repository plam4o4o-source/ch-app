name: Scan crash repro (temporary)
on:
  push:
    branches: [debug/scan-crash]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.2.10 -R ${{ github.repository }} -p 'chitalishte-yavorets-1.2.10.apk' -O app.apk && ls -l app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scan-repro/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-repro
          path: out/
