org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache: по-бърз старт на всяко извикване и паралелни задачи в един модул.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Сваляне на зависимости: Maven Central понякога отговаря с 429/5xx или прекъсва връзката.
# По-дълго чакане на връзка/отговор (по подразбиране 30 s) и до 6 опита на заявка със
# същото хранилище (2, 4, 8, 16, 32 s пауза; по подразбиране 3 опита от 1 s) — едва после
# Gradle го изключва до края на build-а. 404 („Could not find“) Gradle не опитва пак — за него
# и за изключено хранилище CI пуска командата още веднъж (.github/scripts/gradle-retry.sh).
# Същото е в shared/gradle.properties (shared се строи и самостоятелно).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
